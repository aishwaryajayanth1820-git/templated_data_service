<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1400" height="900" fill="#ffffff"/>
  <text x="40" y="54" font-size="30" font-weight="700" fill="#111827">Architecture: one deployable, driven by a live catalog</text>

  <!-- Browser -->
  <rect x="200" y="84" width="1000" height="96" rx="14" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="700" y="120" text-anchor="middle" font-size="21" font-weight="700" fill="#5b21b6">React SPA (Mantine, TanStack Query)</text>
  <text x="700" y="150" text-anchor="middle" font-size="16" fill="#5b21b6">Generic data pages  ·  Roles &amp; Users admin  ·  Schema Studio  —  rendered from /api/meta</text>
  <line x1="700" y1="182" x2="700" y2="238" stroke="#475569" stroke-width="2.5" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="716" y="216" font-size="14" fill="#475569">JSON over HTTPS · session cookie + CSRF · X-TDS-Catalog-Generation</text>

  <!-- Spring Boot container -->
  <rect x="120" y="244" width="1000" height="476" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
  <text x="144" y="276" font-size="17" font-weight="700" fill="#334155">Spring Boot 4.1 · Java 21 · single JAR</text>

  <rect x="150" y="292" width="940" height="56" rx="10" fill="#e2e8f0"/>
  <text x="620" y="327" text-anchor="middle" font-size="17" fill="#0f172a" font-family="Cascadia Code, Consolas, monospace">/api/auth   /api/meta   /api/data/{table}   /api/admin/…</text>

  <g font-size="16">
    <rect x="150" y="368" width="292" height="108" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
    <text x="170" y="398" font-weight="700" fill="#92400e">Record engine</text>
    <text x="170" y="424" fill="#92400e">query · filter · paging</text>
    <text x="170" y="448" fill="#92400e">validate · codec · FK display</text>

    <rect x="474" y="368" width="292" height="108" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="494" y="398" font-weight="700" fill="#1e40af">Catalog (live snapshot)</text>
    <text x="494" y="424" fill="#1e40af">immutable, generation N</text>
    <text x="494" y="448" fill="#1e40af">swapped after each publish</text>

    <rect x="798" y="368" width="292" height="108" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="818" y="398" font-weight="700" fill="#065f46">DDL &amp; migrations</text>
    <text x="818" y="424" fill="#065f46">plan · pre-check · apply</text>
    <text x="818" y="448" fill="#065f46">SQLite rebuild · versions</text>

    <rect x="150" y="496" width="292" height="108" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="170" y="526" font-weight="700" fill="#991b1b">Security &amp; access</text>
    <text x="170" y="552" fill="#991b1b">users · roles · sessions</text>
    <text x="170" y="576" fill="#991b1b">table ops ∩ field ops</text>

    <rect x="474" y="496" width="292" height="108" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="494" y="526" font-weight="700" fill="#5b21b6">Script engine (GraalJS)</text>
    <text x="494" y="552" fill="#5b21b6">sandbox · timeout · ctx API</text>
    <text x="494" y="576" fill="#5b21b6">hot reload · last good version</text>

    <rect x="798" y="496" width="292" height="108" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="818" y="526" font-weight="700" fill="#334155">Drafts &amp; publish</text>
    <text x="818" y="552" fill="#334155">Studio API · checksums</text>
    <text x="818" y="576" fill="#334155">import / export · seeding</text>
  </g>

  <rect x="150" y="624" width="940" height="74" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="620" y="655" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Grammar  tds/v1  (pure Java, no Spring)</text>
  <text x="620" y="681" text-anchor="middle" font-size="15" fill="#334155">template model · JSON Schema 2020-12 meta-schema · semantic checks · JsonLogic · record rules</text>

  <!-- Files -->
  <rect x="1182" y="368" width="196" height="236" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="1280" y="400" text-anchor="middle" font-size="17" font-weight="700" fill="#92400e">Files</text>
  <g font-size="14.5" fill="#92400e" font-family="Cascadia Code, Consolas, monospace">
    <text x="1198" y="436">templates/*.json</text>
    <text x="1198" y="464">  seed · import</text>
    <text x="1198" y="500">scripts/**.js</text>
    <text x="1198" y="528">  watched</text>
    <text x="1198" y="564">action-output/</text>
  </g>
  <line x1="1124" y1="486" x2="1178" y2="486" stroke="#475569" stroke-width="2.5" marker-end="url(#a)" marker-start="url(#a)"/>

  <!-- DB: bottom curve first, then body, then top cap, then text -->
  <g>
    <ellipse cx="620" cy="862" rx="270" ry="20" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <rect x="350" y="784" width="540" height="78" fill="#e0f2fe" stroke="none"/>
    <line x1="350" y1="784" x2="350" y2="862" stroke="#0284c7" stroke-width="2"/>
    <line x1="890" y1="784" x2="890" y2="862" stroke="#0284c7" stroke-width="2"/>
    <ellipse cx="620" cy="784" rx="270" ry="20" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
    <text x="620" y="826" text-anchor="middle" font-size="18" font-weight="700" fill="#075985">SQLite (local) · PostgreSQL (planned)</text>
    <text x="620" y="852" text-anchor="middle" font-size="14.5" fill="#075985">tds_* system tables (Flyway)  +  tables generated from templates</text>
  </g>
  <line x1="620" y1="724" x2="620" y2="760" stroke="#475569" stroke-width="2.5" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="634" y="748" font-size="13" fill="#475569">read / write</text>

  <!-- External writers -->
  <rect x="40" y="770" width="250" height="96" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="165" y="804" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">External feeds</text>
  <text x="165" y="830" text-anchor="middle" font-size="14" fill="#475569">VIEW / DATA_SOURCE rows</text>
  <text x="165" y="852" text-anchor="middle" font-size="14" fill="#475569">via SQL or REST</text>
  <line x1="292" y1="818" x2="346" y2="818" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
</svg>
