<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" width="1400" height="780" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1400" height="780" fill="#ffffff"/>
  <text x="40" y="54" font-size="30" font-weight="700" fill="#111827">Dynamic schema management: draft → live, safely</text>

  <!-- Flow -->
  <g font-size="15">
    <rect x="40" y="96" width="232" height="190" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="156" y="132" text-anchor="middle" font-size="20" font-weight="700" fill="#334155">1 · Draft</text>
    <text x="60" y="166" fill="#334155">Edit in Schema Studio</text>
    <text x="60" y="190" fill="#334155">or import JSON</text>
    <text x="60" y="214" fill="#334155">Saved with a checksum</text>
    <text x="60" y="238" fill="#334155">(no lost updates)</text>

    <rect x="312" y="96" width="232" height="190" rx="14" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <text x="428" y="132" text-anchor="middle" font-size="20" font-weight="700" fill="#713f12">2 · Validate</text>
    <text x="332" y="166" fill="#713f12">JSON Schema 2020-12</text>
    <text x="332" y="190" fill="#713f12">Semantic checks with codes</text>
    <text x="332" y="214" fill="#713f12">E0xx errors · W0xx warnings</text>
    <text x="332" y="238" fill="#713f12">Live, as you type</text>

    <rect x="584" y="96" width="232" height="190" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="700" y="132" text-anchor="middle" font-size="20" font-weight="700" fill="#1e3a8a">3 · Plan</text>
    <text x="604" y="166" fill="#1e3a8a">Diff vs published version</text>
    <text x="604" y="190" fill="#1e3a8a">Classify every step</text>
    <text x="604" y="214" fill="#1e3a8a">Count rows that would break</text>
    <text x="604" y="238" fill="#1e3a8a">DDL for SQLite + PostgreSQL</text>

    <rect x="856" y="96" width="232" height="190" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="972" y="132" text-anchor="middle" font-size="20" font-weight="700" fill="#065f46">4 · Publish</text>
    <text x="876" y="166" fill="#065f46">One DB transaction</text>
    <text x="876" y="190" fill="#065f46">Stores JSON, plan and</text>
    <text x="876" y="214" fill="#065f46">the exact SQL applied</text>
    <text x="876" y="238" fill="#065f46">as version N</text>

    <rect x="1128" y="96" width="232" height="190" rx="14" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="1244" y="132" text-anchor="middle" font-size="20" font-weight="700" fill="#5b21b6">5 · Live</text>
    <text x="1148" y="166" fill="#5b21b6">Catalog snapshot swapped</text>
    <text x="1148" y="190" fill="#5b21b6">API serves the new table</text>
    <text x="1148" y="214" fill="#5b21b6">UI refreshes its menus</text>
    <text x="1148" y="238" fill="#5b21b6">No restart, no deploy</text>
  </g>
  <g stroke="#2563eb" stroke-width="3">
    <line x1="274" y1="191" x2="306" y2="191" marker-end="url(#a)"/>
    <line x1="546" y1="191" x2="578" y2="191" marker-end="url(#a)"/>
    <line x1="818" y1="191" x2="850" y2="191" marker-end="url(#a)"/>
    <line x1="1090" y1="191" x2="1122" y2="191" marker-end="url(#a)"/>
  </g>

  <!-- Step classes -->
  <text x="40" y="340" font-size="21" font-weight="700" fill="#111827">Every change in a plan is classified</text>
  <g font-size="16">
    <rect x="40" y="362" width="150" height="38" rx="19" fill="#f3f4f6"/><text x="115" y="387" text-anchor="middle" font-weight="700" fill="#374151">metadata</text>
    <text x="210" y="387" fill="#374151">labels, UI, access, view, actions: no SQL at all</text>
    <rect x="40" y="414" width="150" height="38" rx="19" fill="#d1fae5"/><text x="115" y="439" text-anchor="middle" font-weight="700" fill="#065f46">safe</text>
    <text x="210" y="439" fill="#374151">add a nullable column, rename (data kept), add an enum value, add an index</text>
    <rect x="40" y="466" width="150" height="38" rx="19" fill="#fef3c7"/><text x="115" y="491" text-anchor="middle" font-weight="700" fill="#92400e">checked</text>
    <text x="210" y="491" fill="#374151">make required, add unique, tighten a constraint: blocked while existing rows would break</text>
    <rect x="40" y="518" width="150" height="38" rx="19" fill="#fee2e2"/><text x="115" y="543" text-anchor="middle" font-weight="700" fill="#991b1b">destructive</text>
    <text x="210" y="543" fill="#374151">drop a column, remove an enum value: admin types the table name to confirm</text>
    <rect x="40" y="570" width="150" height="38" rx="19" fill="#fecaca"/><text x="115" y="595" text-anchor="middle" font-weight="700" fill="#7f1d1d">blocked</text>
    <text x="210" y="595" fill="#374151">change a field’s type: not allowed; add a new field instead</text>
  </g>

  <!-- SQLite rebuild -->
  <rect x="40" y="640" width="1320" height="110" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="64" y="672" font-size="17" font-weight="700" fill="#0f172a">On SQLite, structural changes use the documented table rebuild, all inside one transaction:</text>
  <g font-size="15" fill="#334155" font-family="Cascadia Code, Consolas, monospace">
    <text x="64" y="704">foreign_keys OFF → CREATE t__new → INSERT … SELECT (with rename mapping) → DROP t → RENAME t__new TO t</text>
    <text x="64" y="730">→ recreate indexes → PRAGMA foreign_key_check (must be empty) → COMMIT → foreign_keys ON</text>
  </g>
</svg>
