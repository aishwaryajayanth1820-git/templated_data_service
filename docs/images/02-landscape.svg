<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" width="1400" height="820" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <symbol id="full" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#2563eb"/></symbol>
    <symbol id="half" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/><path d="M12 3 A9 9 0 0 0 12 21 Z" fill="#2563eb"/></symbol>
    <symbol id="none" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#ffffff" stroke="#9ca3af" stroke-width="2.5"/></symbol>
  </defs>
  <rect width="1400" height="820" fill="#ffffff"/>
  <text x="40" y="56" font-size="30" font-weight="700" fill="#111827">Where TDS sits in the landscape</text>
  <text x="40" y="88" font-size="17" fill="#6b7280">Simplified, category-level view. Individual products vary and evolve; they are far more mature than this project.</text>

  <!-- TDS column highlight -->
  <rect x="1222" y="112" width="148" height="640" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>

  <!-- Column headers -->
  <g font-size="15" font-weight="700" fill="#111827" text-anchor="middle">
    <text x="568" y="140">Headless CMS /</text><text x="568" y="160">data platforms</text>
    <text x="568" y="182" font-weight="400" fill="#6b7280" font-size="13">e.g. Directus, Strapi</text>
    <text x="732" y="140">Low-code app</text><text x="732" y="160">builders</text>
    <text x="732" y="182" font-weight="400" fill="#6b7280" font-size="13">e.g. Retool, Appsmith</text>
    <text x="896" y="140">Auto-generated</text><text x="896" y="160">APIs</text>
    <text x="896" y="182" font-weight="400" fill="#6b7280" font-size="13">e.g. Hasura, PostgREST</text>
    <text x="1060" y="140">Form-schema</text><text x="1060" y="160">libraries</text>
    <text x="1060" y="182" font-weight="400" fill="#6b7280" font-size="13">e.g. JSON Forms, RJSF</text>
    <text x="1296" y="150" font-size="22" fill="#1d4ed8">TDS</text>
    <text x="1296" y="176" font-weight="400" fill="#1e40af" font-size="13">this project</text>
  </g>
  <line x1="40" y1="200" x2="1370" y2="200" stroke="#e5e7eb" stroke-width="2"/>

  <!-- Rows: label, then marks at x = 556, 720, 884, 1048, 1284 (icon 24 wide) -->
  <g font-size="17" fill="#1f2937">
    <text x="40" y="244">Define tables without writing code</text>
    <text x="40" y="314">Generated end-user UI (grid + forms)</text>
    <text x="40" y="384">REST API for every table</text>
    <text x="40" y="454">Field-level permissions per role</text>
    <text x="40" y="516">One rule language enforced in</text>
    <text x="40" y="538">browser, server and database</text>
    <text x="40" y="586">Reviewed schema migrations with</text>
    <text x="40" y="608">pre-checks on existing rows</text>
    <text x="40" y="664">Sandboxed scripted actions as files</text>
    <text x="40" y="734">Embeds as one Spring Boot JAR</text>
  </g>
  <g stroke="#f3f4f6" stroke-width="1.5">
    <line x1="40" y1="272" x2="1370" y2="272"/><line x1="40" y1="342" x2="1370" y2="342"/>
    <line x1="40" y1="412" x2="1370" y2="412"/><line x1="40" y1="482" x2="1370" y2="482"/>
    <line x1="40" y1="562" x2="1370" y2="562"/><line x1="40" y1="632" x2="1370" y2="632"/>
    <line x1="40" y1="702" x2="1370" y2="702"/>
  </g>
  <!-- row 1 -->
  <use href="#full" x="556" y="226" width="24" height="24"/><use href="#half" x="720" y="226" width="24" height="24"/>
  <use href="#none" x="884" y="226" width="24" height="24"/><use href="#none" x="1048" y="226" width="24" height="24"/>
  <use href="#full" x="1284" y="226" width="24" height="24"/>
  <!-- row 2 -->
  <use href="#half" x="556" y="296" width="24" height="24"/><use href="#half" x="720" y="296" width="24" height="24"/>
  <use href="#none" x="884" y="296" width="24" height="24"/><use href="#half" x="1048" y="296" width="24" height="24"/>
  <use href="#full" x="1284" y="296" width="24" height="24"/>
  <!-- row 3 -->
  <use href="#full" x="556" y="366" width="24" height="24"/><use href="#none" x="720" y="366" width="24" height="24"/>
  <use href="#full" x="884" y="366" width="24" height="24"/><use href="#none" x="1048" y="366" width="24" height="24"/>
  <use href="#full" x="1284" y="366" width="24" height="24"/>
  <!-- row 4 -->
  <use href="#full" x="556" y="436" width="24" height="24"/><use href="#half" x="720" y="436" width="24" height="24"/>
  <use href="#full" x="884" y="436" width="24" height="24"/><use href="#none" x="1048" y="436" width="24" height="24"/>
  <use href="#full" x="1284" y="436" width="24" height="24"/>
  <!-- row 5 -->
  <use href="#half" x="556" y="510" width="24" height="24"/><use href="#none" x="720" y="510" width="24" height="24"/>
  <use href="#half" x="884" y="510" width="24" height="24"/><use href="#half" x="1048" y="510" width="24" height="24"/>
  <use href="#full" x="1284" y="510" width="24" height="24"/>
  <!-- row 6 -->
  <use href="#half" x="556" y="584" width="24" height="24"/><use href="#none" x="720" y="584" width="24" height="24"/>
  <use href="#half" x="884" y="584" width="24" height="24"/><use href="#none" x="1048" y="584" width="24" height="24"/>
  <use href="#full" x="1284" y="584" width="24" height="24"/>
  <!-- row 7 -->
  <use href="#half" x="556" y="646" width="24" height="24"/><use href="#half" x="720" y="646" width="24" height="24"/>
  <use href="#half" x="884" y="646" width="24" height="24"/><use href="#none" x="1048" y="646" width="24" height="24"/>
  <use href="#full" x="1284" y="646" width="24" height="24"/>
  <!-- row 8 -->
  <use href="#none" x="556" y="716" width="24" height="24"/><use href="#none" x="720" y="716" width="24" height="24"/>
  <use href="#none" x="884" y="716" width="24" height="24"/><use href="#half" x="1048" y="716" width="24" height="24"/>
  <use href="#full" x="1284" y="716" width="24" height="24"/>

  <!-- Legend -->
  <g font-size="15" fill="#4b5563">
    <use href="#full" x="40" y="776" width="20" height="20"/><text x="68" y="792">typical / built in</text>
    <use href="#half" x="230" y="776" width="20" height="20"/><text x="258" y="792">partial, admin-oriented, or via extra setup</text>
    <use href="#none" x="610" y="776" width="20" height="20"/><text x="638" y="792">not the focus</text>
  </g>
</svg>
