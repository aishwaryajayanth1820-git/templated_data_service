<html lang="en">
<head>

<title>TDS Schema Studio</title>
<style>
:root {
  --bg: #f5f6f8; --panel: #ffffff; --panel-2: #f0f2f5; --border: #dfe3e8; --border-strong: #c5ccd5;
  --text: #1c2430; --muted: #66707d; --accent: #2f6fde; --accent-weak: #e6eefc; --accent-text: #ffffff;
  --danger: #c93a3a; --danger-weak: #fbeaea; --warn: #a86400; --warn-weak: #fdf2e0; --ok: #23824a; --ok-weak: #e4f4ea;

  --c-grey: #6b7280; --c-red: #c93a3a; --c-orange: #c2610f; --c-yellow: #9a7b00; --c-green: #23824a; --c-blue: #2f6fde; --c-purple: #7c4dcc;
}

    --danger: #f07b7b; --danger-weak: #3a2224; --warn: #e9b056; --warn-weak: #3a2f1c; --ok: #5fcf8c; --ok-weak: #1d3527;
    --code-bg: #151a21; --shadow: 0 8px 28px rgba(0, 0, 0, .5);
    --c-grey: #9aa3af; --c-red: #f07b7b; --c-orange: #f0a35e; --c-yellow: #e0c45c; --c-green: #5fcf8c; --c-blue: #6b9bf2; --c-purple: #b394f0;
  }
}
:root[data-theme="dark"] {
  --bg: #12161c; --panel: #1a1f27; --panel-2: #222833; --border: #2e3642; --border-strong: #404a58;
  --text: #e3e8ef; --muted: #98a2b0; --accent: #6b9bf2; --accent-weak: #22324d; --accent-text: #0d1320;
  --danger: #f07b7b; --danger-weak: #3a2224; --warn: #e9b056; --warn-weak: #3a2f1c; --ok: #5fcf8c; --ok-weak: #1d3527;
  --code-bg: #151a21; --shadow: 0 8px 28px rgba(0, 0, 0, .5);
  --c-grey: #9aa3af; --c-red: #f07b7b; --c-orange: #f0a35e; --c-yellow: #e0c45c; --c-green: #5fcf8c; --c-blue: #6b9bf2; --c-purple: #b394f0;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 13.5px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
code, pre, textarea.code, .mono { font-variant-ligatures: none; font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 12.5px; }
button { font: inherit; }
.app { display: grid; grid-template-rows: 48px 1fr; height: 100vh; }
.topbar { display: flex; align-items: center; gap: 16px; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
.brand { font-weight: 650; letter-spacing: .2px; }
.brand span { color: var(--muted); font-weight: 450; }
.topnav { display: flex; gap: 4px; margin-left: 12px; }
.topnav button { background: none; border: 0; color: var(--muted); padding: 6px 10px; border-radius: 6px; cursor: pointer; }
.topnav button.on { color: var(--text); background: var(--panel-2); }
.topnav button:disabled { opacity: .5; cursor: default; }
.spacer { flex: 1; }
.body { display: grid; grid-template-columns: 250px 1fr; min-height: 0; }
.sidebar { background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.side-head { display: flex; gap: 6px; padding: 12px; border-bottom: 1px solid var(--border); }
.tlist { overflow: auto; padding: 6px; }
.titem { display: block; width: 100%; text-align: left; background: none; border: 1px solid transparent; border-radius: 8px; padding: 8px 10px; cursor: pointer; color: var(--text); margin-bottom: 2px; }
.titem:hover { background: var(--panel-2); }
.titem.on { background: var(--accent-weak); border-color: var(--accent); }
.titem .row1 { display: flex; align-items: center; gap: 6px; font-weight: 600; }
.titem .row2 { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; margin-top: 2px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dot.pub { background: var(--ok); } .dot.chg { background: var(--warn); } .dot.draft { background: var(--muted); }
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.thead { padding: 14px 20px 0; background: var(--panel); border-bottom: 1px solid var(--border); }
.thead-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.thead h1 { font-size: 19px; margin: 0; font-weight: 650; }
.thead .sub { color: var(--muted); margin: 2px 0 10px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; margin-top: 8px; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; color: var(--muted); cursor: pointer; white-space: nowrap; }
.tabs button.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.tabs .cnt { margin-left: 5px; font-size: 11px; background: var(--panel-2); border-radius: 9px; padding: 0 6px; color: var(--muted); }
.content { flex: 1; overflow: auto; padding: 16px 20px 24px; min-height: 0; }
.btn { background: var(--panel); color: var(--text); border: 1px solid var(--border-strong); border-radius: 7px; padding: 5px 11px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
.btn.danger { color: var(--danger); }
.btn.sm { padding: 2px 8px; font-size: 12px; }
.btn.ghost { border-color: transparent; background: none; }
.btn.ghost.sm { padding: 2px 5px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 7px; overflow: hidden; }
.seg button { background: var(--panel); color: var(--muted); border: 0; padding: 4px 10px; cursor: pointer; border-right: 1px solid var(--border); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent-weak); color: var(--text); font-weight: 600; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; padding: 1px 8px; border-radius: 10px; background: var(--panel-2); color: var(--muted); border: 1px solid var(--border); white-space: nowrap; }
.chip.err { background: var(--danger-weak); color: var(--danger); border-color: transparent; }
.chip.warn { background: var(--warn-weak); color: var(--warn); border-color: transparent; }
.chip.ok { background: var(--ok-weak); color: var(--ok); border-color: transparent; }
.chip.acc { background: var(--accent-weak); color: var(--accent); border-color: transparent; }
.mt { white-space: nowrap; font-size: 10.5px; font-weight: 700; letter-spacing: .4px; padding: 1px 6px; border-radius: 4px; }
.mt.VIEW { background: var(--accent-weak); color: var(--accent); }
.mt.MANAGE_VIEW { background: var(--ok-weak); color: var(--ok); }
.mt.DATA_SOURCE { background: var(--panel-2); color: var(--muted); border: 1px solid var(--border); }
.badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11.5px; font-weight: 600; border: 1px solid currentColor; }
.c-grey { color: var(--c-grey); } .c-red { color: var(--c-red); } .c-orange { color: var(--c-orange); } .c-yellow { color: var(--c-yellow); }
.c-green { color: var(--c-green); } .c-blue { color: var(--c-blue); } .c-purple { color: var(--c-purple); }
.muted { color: var(--muted); }
.split { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(340px, 1fr); gap: 16px; align-items: start; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; }
.card-h { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border); font-weight: 600; }
.card-b { padding: 12px 14px; }
.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; padding: 7px 10px; border-bottom: 1px solid var(--border); background: var(--panel-2); white-space: nowrap; position: sticky; top: 0; }
.tbl td { padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.tbl tr.sel td { background: var(--accent-weak); }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: var(--panel-2); }
.tbl tr.sel:hover td { background: var(--accent-weak); }
.tbl th.sortable { cursor: pointer; user-select: none; }
.tbl .num { text-align: right; font-variant-numeric: tabular-nums; }
.section { margin-bottom: 16px; }
.section-t { font-size: 11.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); font-weight: 700; margin: 4px 0 8px; display: flex; align-items: center; gap: 8px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
.fld { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.fld > span.l { font-size: 12px; color: var(--muted); }
.fld .hint { font-size: 11.5px; color: var(--muted); }
.inp, select.inp, textarea.inp { width: 100%; background: var(--panel); color: var(--text); border: 1px solid var(--border-strong); border-radius: 6px; padding: 5px 8px; font: inherit; }
textarea.inp { resize: vertical; }
.inp:focus { outline: 2px solid var(--accent-weak); border-color: var(--accent); }
.inp.invalid { border-color: var(--danger); }
.inp:disabled { background: var(--panel-2); color: var(--muted); }
.chk { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.err-t { color: var(--danger); font-size: 12px; }
.pickers { display: flex; flex-wrap: wrap; gap: 6px; }
.pick { border: 1px solid var(--border-strong); background: var(--panel); color: var(--muted); border-radius: 14px; padding: 2px 10px; cursor: pointer; font-size: 12px; }
.pick.on { background: var(--accent-weak); color: var(--text); border-color: var(--accent); }
pre.code { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin: 0; overflow: auto; white-space: pre; }
textarea.code { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 12.5px; background: var(--code-bg); }
.issues { border-top: 1px solid var(--border); background: var(--panel); max-height: 34vh; overflow: auto; }
.issues-h { display: flex; align-items: center; gap: 8px; padding: 6px 20px; cursor: pointer; font-weight: 600; position: sticky; top: 0; background: var(--panel); }
.issue { display: flex; gap: 10px; padding: 5px 20px; border-top: 1px solid var(--border); cursor: pointer; }
.issue:hover { background: var(--panel-2); }
.issue .code { font-family: ui-monospace, Consolas, monospace; font-size: 12px; width: 44px; flex: none; }
.issue.error .code { color: var(--danger); } .issue.warning .code { color: var(--warn); }
.toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.banner { border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; border: 1px solid var(--border); background: var(--panel-2); }
.banner.info { background: var(--accent-weak); border-color: transparent; }
.banner.warn { background: var(--warn-weak); border-color: transparent; }
.banner.err { background: var(--danger-weak); border-color: transparent; }
.detail { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px 24px; padding: 6px 4px 10px 36px; }
.detail dt { font-size: 11.5px; color: var(--muted); }
.detail dd { margin: 0; white-space: pre-wrap; }
.dgroup { font-size: 11px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); font-weight: 700; grid-column: 1 / -1; margin-top: 4px; }
.flag { color: var(--warn); cursor: help; }
.modal-bg { position: fixed; inset: 0; background: rgba(10, 15, 25, .45); display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px; z-index: 20; }
.modal { background: var(--panel); border-radius: 12px; box-shadow: var(--shadow); width: min(680px, 100%); max-height: 86vh; display: flex; flex-direction: column; }
.modal.wide { width: min(900px, 100%); }
.modal-h { padding: 14px 18px; border-bottom: 1px solid var(--border); font-weight: 650; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.modal-b { padding: 14px 18px; overflow: auto; }
.modal-f { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }
.drawer-bg { position: fixed; inset: 0; background: rgba(10, 15, 25, .35); z-index: 20; display: flex; justify-content: flex-end; }
.drawer { background: var(--panel); width: min(520px, 100%); height: 100%; display: flex; flex-direction: column; box-shadow: var(--shadow); }
.step { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; border-bottom: 1px dashed var(--border); }
.step .cls { width: 92px; flex: none; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 16px; border-radius: 8px; z-index: 30; box-shadow: var(--shadow); }
.matrix td, .matrix th { text-align: center; }
.matrix td:first-child, .matrix th:first-child { text-align: left; }
.pager { display: flex; align-items: center; gap: 8px; justify-content: flex-end; padding: 8px 0; color: var(--muted); }
.empty { color: var(--muted); padding: 30px; text-align: center; }
.rule-card { margin-bottom: 12px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; }
.endpoint { display: flex; gap: 8px; padding: 3px 0; }
.endpoint b { width: 58px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
@media (max-width: 900px) {
  .body { grid-template-columns: 1fr; }
  .sidebar { max-height: 30vh; border-right: 0; border-bottom: 1px solid var(--border); }
  .split { grid-template-columns: 1fr; }
  .grid2 { grid-template-columns: 1fr; }
  .content { padding: 12px 16px; }
  .thead { padding: 12px 16px 0; }
  .topbar { gap: 8px; padding: 0 12px; }
  .topbar .chip, .brand span { display: none; }
  .topnav { margin-left: 0; }
}
</style>

<script type="module">
import { html, render, useState, useMemo, useEffect } from 'https://unpkg.com/htm@3.1.1/preact/standalone.module.js';

/* ============================================================================
 * Grammar model (tds/v1) — mirrors docs/01-schema-grammar.md
 * ========================================================================== */
const SEED = JSON.parse(document.getElementById('seed').textContent);
const STORE_KEY = 'tds-schema-studio/v1';
const AUDIT = ['created_at', 'created_by', 'updated_at', 'updated_by', 'row_version'];
const NAME_RE = /^[a-z][a-z0-9_]{0,62}$/;
const ROLE_RE = /^[a-z][a-z0-9_]{0,40}$/;
const MANAGE_TYPES = {
  VIEW: 'Viewer grid only. Rows arrive via REST or direct DB insert.',
  MANAGE_VIEW: 'Admin edits rows in a generated form; viewers see the grid.',
  DATA_SOURCE: 'No UI. Loaded directly; feeds other tables as a ref/lookup.',
};
const TYPES = {
  id:       { label: 'id (PK)',  widgets: [] },
  string:   { label: 'string',   widgets: ['text', 'textarea'], str: true },
  text:     { label: 'text',     widgets: ['textarea', 'text'], str: true },
  integer:  { label: 'integer',  widgets: ['number'], num: true, int: true },
  long:     { label: 'long',     widgets: ['number'], num: true, int: true },
  decimal:  { label: 'decimal',  widgets: ['number'], num: true },
  double:   { label: 'double',   widgets: ['number'], num: true },
  boolean:  { label: 'boolean',  widgets: ['switch', 'checkbox'] },
  date:     { label: 'date',     widgets: ['date'], temporal: true },
  datetime: { label: 'datetime', widgets: ['datetime'], temporal: true },
  time:     { label: 'time',     widgets: ['time'], temporal: true },
  enum:     { label: 'enum',     widgets: ['select', 'radio'] },
  ref:      { label: 'ref (FK)', widgets: ['lookup'] },
  json:     { label: 'json',     widgets: ['json', 'textarea'] },
  uuid:     { label: 'uuid',     widgets: ['text'] },
};
const COLORS = ['grey', 'red', 'orange', 'yellow', 'green', 'blue', 'purple'];
const TABLE_OPS = ['read', 'create', 'update', 'delete'];
const FIELD_OPS = ['read', 'create', 'update'];
const BUILTIN_ROLES = ['admin', 'viewer'];

const clone = v => structuredClone(v);
const present = v => v !== null && v !== undefined && !(typeof v === 'string' && v.trim() === '');
const truthy = v => Array.isArray(v) ? v.length > 0 : !!v;
const stable = v => JSON.stringify(v, (k, x) => x && typeof x === 'object' && !Array.isArray(x)
  ? Object.keys(x).sort().reduce((o, k2) => (o[k2] = x[k2], o), {}) : x);
const same = (a, b) => stable(a) === stable(b);
const enumValues = f => (f.values || []).map(v => typeof v === 'string' ? { value: v } : v);
const placementOf = f => f.type === 'id' ? (f.ui?.placement || 'hidden') : (f.ui?.placement || 'column');
const widgetOf = f => f.ui?.widget || TYPES[f.type]?.widgets[0];
const ordered = fields => fields.map((f, i) => ({ f, o: f.ui?.order ?? (i + 1) * 10 })).sort((a, b) => a.o - b.o).map(x => x.f);
const knownFields = t => new Set([...(t.fields || []).map(f => f.name), ...AUDIT]);
const setOrDel = (o, k, v) => { if (v === undefined || v === null || v === '' || (Array.isArray(v) && !v.length)) delete o[k]; else o[k] = v; };
function setSub(obj, sub, key, v) {
  obj[sub] = obj[sub] || {};
  setOrDel(obj[sub], key, v);
  if (!Object.keys(obj[sub]).length) delete obj[sub];
}

/* Keep every reference to a field in step with a rename or delete. */
function renameRefs(t, from, to) {
  const r = n => n === from ? to : n;
  const rl = x => x === undefined ? x : JSON.parse(JSON.stringify(x), (k, v) =>
    k === 'var' && typeof v === 'string' && (v === from || v.startsWith(from + '.')) ? to + v.slice(from.length) : v);
  for (const ix of t.indexes || []) ix.fields = ix.fields.map(r);
  for (const ru of t.rules || []) {
    if (ru.if) ru.if = r(ru.if);
    if (ru.then) ru.then = ru.then.map(r);
    if (ru.fields) ru.fields = ru.fields.map(r);
    if (ru.when !== undefined) ru.when = rl(ru.when);
    if (ru.assert !== undefined) ru.assert = rl(ru.assert);
  }
  const v = t.view;
  if (v) {
    if (v.titleField) v.titleField = r(v.titleField);
    (v.defaultSort || []).forEach(x => { x.field = r(x.field); });
    if (v.search) v.search = v.search.map(r);
    if (v.filters) v.filters = v.filters.map(r);
  }
  for (const f of t.fields) {
    if (f.requiredWhen !== undefined) f.requiredWhen = rl(f.requiredWhen);
    if (f.ui?.visibleWhen !== undefined) f.ui.visibleWhen = rl(f.ui.visibleWhen);
    if (f.ui?.readonlyWhen !== undefined) f.ui.readonlyWhen = rl(f.ui.readonlyWhen);
  }
  for (const a of t.actions || []) if (a.visibleWhen !== undefined) a.visibleWhen = rl(a.visibleWhen);
}
function dropRefs(t, name) {
  const keep = n => n !== name;
  t.indexes = (t.indexes || []).map(ix => ({ ...ix, fields: ix.fields.filter(keep) })).filter(ix => ix.fields.length);
  if (!t.indexes.length) delete t.indexes;
  for (const ru of t.rules || []) {
    if (ru.then) ru.then = ru.then.filter(keep);
    if (ru.fields) ru.fields = ru.fields.filter(keep);
  }
  const v = t.view;
  if (v) {
    if (v.titleField === name) delete v.titleField;
    if (v.defaultSort) { v.defaultSort = v.defaultSort.filter(x => keep(x.field)); if (!v.defaultSort.length) delete v.defaultSort; }
    if (v.search) { v.search = v.search.filter(keep); if (!v.search.length) delete v.search; }
    if (v.filters) { v.filters = v.filters.filter(keep); if (!v.filters.length) delete v.filters; }
  }
}

/* ---------- JsonLogic (subset + custom `present`) ---------- */
function jl(rule, data) {
  if (Array.isArray(rule)) return rule.map(r => jl(r, data));
  if (rule === null || typeof rule !== 'object') return rule;
  const op = Object.keys(rule)[0];
  let args = rule[op];
  if (!Array.isArray(args)) args = [args];
  if (op === 'if') {
    let i = 0;
    for (; i < args.length - 1; i += 2) if (truthy(jl(args[i], data))) return jl(args[i + 1], data);
    return i < args.length ? jl(args[i], data) : null;
  }
  if (op === 'and') { let v = true; for (const a of args) { v = jl(a, data); if (!truthy(v)) return v; } return v; }
  if (op === 'or') { let v = false; for (const a of args) { v = jl(a, data); if (truthy(v)) return v; } return v; }
  const v = args.map(a => jl(a, data));
  switch (op) {
    case 'var': {
      const path = v[0];
      if (path === '' || path == null) return data;
      let cur = data;
      for (const p of String(path).split('.')) { if (cur == null) return v[1] ?? null; cur = cur[p]; }
      return cur === undefined ? (v[1] ?? null) : cur;
    }
    case '==': return v[0] == v[1];
    case '===': return v[0] === v[1];
    case '!=': return v[0] != v[1];
    case '!==': return v[0] !== v[1];
    case '!': return !truthy(v[0]);
    case '!!': return truthy(v[0]);
    case '<': return v.length === 3 ? v[0] < v[1] && v[1] < v[2] : v[0] < v[1];
    case '<=': return v.length === 3 ? v[0] <= v[1] && v[1] <= v[2] : v[0] <= v[1];
    case '>': return v[0] > v[1];
    case '>=': return v[0] >= v[1];
    case 'in': return v[1] != null && typeof v[1].includes === 'function' && v[1].includes(v[0]);
    case '+': return v.reduce((a, b) => a + Number(b), 0);
    case '-': return v.length === 1 ? -v[0] : v[0] - v[1];
    case '*': return v.reduce((a, b) => a * Number(b), 1);
    case '/': return v[0] / v[1];
    case '%': return v[0] % v[1];
    case 'present': return present(v[0]);
    default: throw new Error('Unsupported JsonLogic operator "' + op + '"');
  }
}
function jlVars(rule, out = []) {
  if (Array.isArray(rule)) rule.forEach(r => jlVars(r, out));
  else if (rule && typeof rule === 'object') {
    for (const [k, a] of Object.entries(rule)) {
      if (k === 'var') { const p = Array.isArray(a) ? a[0] : a; if (typeof p === 'string' && p) out.push(p.split('.')[0]); }
      else jlVars(a, out);
    }
  }
  return out;
}

/* ---------- Access ---------- */
const defaultAccess = t => ({ admin: [...TABLE_OPS, 'run:*'], viewer: t.manageType === 'DATA_SOURCE' ? [] : ['read'] });
const accessOf = t => t.access ?? defaultAccess(t);
function tableOps(t, role) {
  if (role === 'admin') return new Set([...TABLE_OPS, 'run:*']);
  return new Set(accessOf(t)[role] || []);
}
function can(t, roles, op) {
  return roles.some(r => { const s = tableOps(t, r); return s.has(op) || (op.startsWith('run:') && s.has('run:*')); });
}
function fieldOps(t, f, roles) {
  const out = new Set();
  for (const r of roles) {
    const tops = tableOps(t, r);
    if (f.type === 'id') { if (tops.has('read')) out.add('read'); continue; }
    const fops = r === 'admin' ? FIELD_OPS : (f.access?.[r] ?? FIELD_OPS);
    for (const op of fops) if (tops.has(op)) out.add(op);
  }
  return out;
}

/* ---------- Template validation (semantic; structure is covered by the JSON Schema) ---------- */
function validateTemplate(t, store) {
  const out = [];
  const E = (code, msg, path) => out.push({ level: 'error', code, msg, path });
  const W = (code, msg, path) => out.push({ level: 'warning', code, msg, path });
  if (!NAME_RE.test(t.name || '') || t.name.startsWith('tds_')) E('E003', `Table name "${t.name}" must be snake_case and must not start with tds_`, 'name');
  if (!MANAGE_TYPES[t.manageType]) E('S001', `manageType must be one of ${Object.keys(MANAGE_TYPES).join(', ')}`, 'manageType');
  const fields = t.fields || [];
  const known = knownFields(t);
  const seen = new Set();
  const checkLogic = (rule, path, what) => {
    if (rule === undefined) return;
    for (const v of jlVars(rule)) if (!v.startsWith('$') && !known.has(v)) E('E031', `${what} references unknown field "${v}"`, path);
    try { jl(rule, {}); } catch (e) { if (String(e.message).startsWith('Unsupported')) W('W006', `${what}: ${e.message}`, path); }
  };
  fields.forEach((f, i) => {
    const p = `fields[${i}]`, n = f.name;
    if (seen.has(n)) E('E001', `Duplicate field name "${n}"`, p);
    seen.add(n);
    if (!NAME_RE.test(n || '')) E('E003', `Field name "${n}" must match ^[a-z][a-z0-9_]{0,62}$`, p);
    if (AUDIT.includes(n)) E('E003', `"${n}" is a reserved audit column`, p);
    if (!TYPES[f.type]) { E('S002', `${n}: unknown type "${f.type}"`, p); return; }
    const c = f.constraints || {};
    if (f.type === 'enum') {
      const vals = enumValues(f).map(x => x.value);
      if (!vals.length) E('S003', `${n}: enum needs at least one value`, p);
      if (new Set(vals).size !== vals.length) E('E021', `${n}: duplicate enum value`, p);
      vals.forEach(v => { if (!/^[A-Za-z0-9_\-]{1,64}$/.test(v || '')) E('S005', `${n}: enum value "${v}" must match [A-Za-z0-9_-]{1,64}`, p); });
      if (f.default !== undefined && typeof f.default !== 'object' && !vals.includes(f.default)) E('E020', `${n}: default "${f.default}" is not one of the enum values`, p);
    }
    if (f.type === 'ref') {
      const tgtName = f.ref?.target;
      const tgt = tgtName && store.templates[tgtName];
      if (!tgtName) E('S004', `${n}: ref needs a target`, p);
      else if (!tgt) E('E010', `${n}: ref target "${tgtName}" does not exist`, p);
      else {
        if (!tgt.published) E('E010', `${n}: ref target "${tgtName}" is not published yet. Publish it first`, p);
        if (!knownFields(tgt.draft).has(f.ref.display)) E('E011', `${n}: display field "${f.ref.display}" not found on ${tgtName}`, p);
      }
      if (f.ref?.onDelete === 'SET_NULL' && f.required) E('E012', `${n}: onDelete SET_NULL needs a nullable field`, p);
    }
    if (f.type === 'string' && c.maxLength && c.maxLength > (f.length ?? 255)) E('E022', `${n}: maxLength ${c.maxLength} exceeds column length ${f.length ?? 255}`, p);
    if (c.min != null && c.max != null && c.min > c.max) E('E023', `${n}: min is greater than max`, p);
    if (c.minLength != null && c.maxLength != null && c.minLength > c.maxLength) E('E023', `${n}: minLength is greater than maxLength`, p);
    if (c.pattern) { try { new RegExp(c.pattern); } catch { E('S006', `${n}: pattern is not a valid regex`, p); } }
    checkLogic(f.requiredWhen, p, `${n}.requiredWhen`);
    checkLogic(f.ui?.visibleWhen, p, `${n}.ui.visibleWhen`);
    checkLogic(f.ui?.readonlyWhen, p, `${n}.ui.readonlyWhen`);
    for (const [role, ops] of Object.entries(f.access || {})) {
      if (!store.roles.includes(role)) W('W001', `${n}: role "${role}" does not exist`, p);
      const tops = tableOps(t, role);
      for (const op of ops) if (!tops.has(op)) W('W004', `${n}: grants "${op}" to ${role} but the table does not, so it has no effect`, p);
    }
    if (t.manageType === 'DATA_SOURCE' && f.type !== 'id' && f.ui && Object.keys(f.ui).length) W('W002', `${n}: ui settings are ignored for DATA_SOURCE`, p);
  });
  const ids = fields.filter(f => f.type === 'id').length;
  if (ids !== 1) E('E002', `Exactly one field of type "id" is required (found ${ids})`, 'fields');
  (t.indexes || []).forEach((ix, i) => {
    if (!/^(ix|ux)_[a-z0-9_]{1,59}$/.test(ix.name || '')) E('S007', `Index name "${ix.name}" must start with ix_ or ux_`, `indexes[${i}]`);
    (ix.fields || []).forEach(n => { if (!known.has(n)) E('E030', `Index ${ix.name} references unknown field "${n}"`, `indexes[${i}]`); });
  });
  const ruleIds = new Set();
  (t.rules || []).forEach((r, i) => {
    const p = `rules[${i}]`;
    if (ruleIds.has(r.id)) E('E001', `Duplicate rule id "${r.id}"`, p);
    ruleIds.add(r.id);
    const refs = r.kind === 'requires' ? [r.if, ...(r.then || [])] : (r.fields || []);
    refs.forEach(n => { if (!known.has(n)) E('E030', `Rule ${r.id} references unknown field "${n}"`, p); });
    if (r.kind === 'requires' && (!r.if || !(r.then || []).length)) E('S008', `Rule ${r.id}: requires needs "if" and at least one "then" field`, p);
    if ((r.kind === 'exclusive' || r.kind === 'atLeastOne') && (r.fields || []).length < 2) E('S008', `Rule ${r.id}: pick at least two fields`, p);
    if (r.kind === 'expr' && !r.message) E('S008', `Rule ${r.id}: expr rules need a message`, p);
    checkLogic(r.when, p, `Rule ${r.id}.when`);
    checkLogic(r.assert, p, `Rule ${r.id}.assert`);
  });
  const v = t.view || {};
  [v.titleField, ...(v.defaultSort || []).map(s => s.field), ...(v.search || []), ...(v.filters || [])]
    .filter(Boolean).forEach(n => { if (!known.has(n)) E('E030', `View references unknown field "${n}"`, 'view'); });
  const actionNames = new Set((t.actions || []).map(a => a.name));
  (t.actions || []).forEach((a, i) => {
    const p = `actions[${i}]`;
    const src = store.scripts[a.script];
    if (src == null) E('E040', `Action ${a.name}: script file "${a.script}" not found`, p);
    else if (!new RegExp(`function\\s+${(a.function || '').replace(/[$]/g, '\\$')}\\s*\\(`).test(src)) E('E040', `Action ${a.name}: function ${a.function}() not found in ${a.script}`, p);
    checkLogic(a.visibleWhen, p, `Action ${a.name}.visibleWhen`);
  });
  for (const [role, ops] of Object.entries(t.access || {})) {
    if (!store.roles.includes(role)) W('W001', `Access: role "${role}" does not exist`, 'access');
    ops.filter(o => o.startsWith('run:') && o !== 'run:*').forEach(o => {
      if (!actionNames.has(o.slice(4))) E('E041', `Access: ${role} grants ${o} but there is no such action`, 'access');
    });
  }
  if (t.manageType === 'MANAGE_VIEW' && !fields.some(f => f.type !== 'id')) W('W003', 'MANAGE_VIEW has no editable field yet', 'fields');
  return out;
}

/* ---------- DDL generation ---------- */
const q = s => `'${String(s).replace(/'/g, "''")}'`;
function sqlLit(v, d, f) {
  if (typeof v === 'boolean') return d === 'pg' ? (v ? 'TRUE' : 'FALSE') : (v ? '1' : '0');
  if (typeof v === 'number') return String(v);
  if (f && TYPES[f.type]?.num) return String(Number(v));
  return q(v);
}
function colType(f, d) {
  const pg = d === 'pg';
  return {

    if (!old.unique && f.unique) S('checked', `Add UNIQUE on ${f.name} (existing duplicates are checked)`);
    if (old.unique && !f.unique) S('safe', `Drop UNIQUE on ${f.name}`);

    if ((f.length ?? 255) > (old.length ?? 255) && f.type === 'string') S('safe', `Grow ${f.name} length ${old.length ?? 255} → ${f.length}`);
