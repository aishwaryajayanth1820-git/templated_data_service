  return html`<div class="pickers">${list.map(f => html`<button type="button" class=${'pick' + (v.includes(f.name) ? ' on' : '')}
      onClick=${() => onChange(v.includes(f.name) ? v.filter(x => x !== f.name) : [...v, f.name])}>${f.name}</button>`)}
    ${!list.length && html`<span class="muted">No eligible fields</span>`}</div>`;
}
function Modal({ title, children, footer, onClose, wide }) {
  return html`<div class="modal-bg" onClick=${e => e.target === e.currentTarget && onClose()}>
    <div class=${'modal' + (wide ? ' wide' : '')} role="dialog" aria-label=${title}>
      <div class="modal-h">${title}<span class="spacer"></span><button class="btn ghost" onClick=${onClose} aria-label="Close">✕</button></div>
      <div class="modal-b">${children}</div>
      ${footer && html`<div class="modal-f">${footer}</div>`}
    </div></div>`;
}

/* ============================================================================
 * Fields tab
 * ========================================================================== */
function typeSummary(f) {
  if (f.type === 'string') return `string(${f.length ?? 255})`;
  if (f.type === 'decimal') return `decimal(${f.precision ?? 18},${f.scale ?? 2})`;
  if (f.type === 'enum') return `enum[${enumValues(f).length}]`;
  if (f.type === 'ref') return `ref → ${f.ref?.target || '?'}`;
  return f.type;
}
function FieldsTab({ t, entry, store, updT, idx, setIdx, issues }) {
  const f = t.fields[idx];
  const move = (i, d) => { const j = i + d; if (j < 0 || j >= t.fields.length) return; updT(x => { const a = x.fields; [a[i], a[j]] = [a[j], a[i]]; }); setIdx(j); };
  const addField = () => {
    let n = 1; while (t.fields.some(x => x.name === `new_field_${n}`)) n++;
    updT(x => x.fields.push({ name: `new_field_${n}`, label: `New field ${n}`, type: 'string', length: 255, ui: { placement: 'column' } }));
    setIdx(t.fields.length);
  };
  const del = i => { updT(x => { const [gone] = x.fields.splice(i, 1); dropRefs(x, gone.name); }); setIdx(Math.max(0, i - 1)); };
  return html`<div class="split">
    <div class="card">
      <div class="card-h">Fields <span class="chip">${t.fields.length}</span><span class="spacer"></span>
        <button class="btn sm" onClick=${addField}>+ Add field</button></div>
      <div style="overflow:auto">
      <table class="tbl">
        <thead><tr><th style="width:64px"></th><th>Name</th><th>Type</th><th>Req</th><th>Uniq</th><th>Placement</th><th></th></tr></thead>
        <tbody>${t.fields.map((x, i) => {
          const n = issues.filter(s => s.path === `fields[${i}]`);
          const errs = n.filter(s => s.level === 'error').length;
          return html`<tr key=${i} class=${'click' + (i === idx ? ' sel' : '')} onClick=${() => setIdx(i)}>
            <td style="white-space:nowrap"><button class="btn ghost sm" title="Move up" onClick=${e => { e.stopPropagation(); move(i, -1); }}>↑</button><button class="btn ghost sm" title="Move down" onClick=${e => { e.stopPropagation(); move(i, 1); }}>↓</button></td>
            <td><div class="mono" style="font-weight:600">${x.name}</div><div class="muted" style="font-size:12px">${x.label || ''}</div></td>
            <td class="mono">${typeSummary(x)}</td>
            <td>${x.type === 'id' ? html`<span class="muted">PK</span>` : x.required ? '✓' : x.requiredWhen ? html`<span class="chip acc" title="requiredWhen">when</span>` : ''}</td>
            <td>${x.unique ? '✓' : ''}</td>
            <td><span class="chip">${t.manageType === 'DATA_SOURCE' ? 'n/a' : placementOf(x)}</span></td>
            <td>${n.length ? html`<span class=${'chip ' + (errs ? 'err' : 'warn')} title=${n.map(s => s.msg).join('\n')}>${n.length}</span>` : ''}</td>
          </tr>`;
        })}</tbody>
      </table></div>
    </div>
    <div>${f ? html`<${FieldInspector} key=${idx} t=${t} f=${f} idx=${idx} entry=${entry} store=${store} updT=${updT} onDelete=${() => del(idx)} />`
      : html`<div class="card empty">Select a field</div>`}</div>
  </div>`;
}

function FieldInspector({ t, f, idx, entry, store, updT, onDelete }) {
  const upd = fn => updT(x => fn(x.fields[idx], x));
  const pubNames = new Set((entry.published?.fields || []).map(x => x.name));
  const isPub = pubNames.has(f.name) || (f.renamedFrom && pubNames.has(f.renamedFrom));
  const T = TYPES[f.type] || {};
  const c = f.constraints || {};
  const others = Object.keys(store.templates).filter(n => n !== t.name);
  const ds = t.manageType === 'DATA_SOURCE';

  const setName = v => upd((x, tt) => {
    const from = x.name;
    if (!v || v === from) return;
    if (!x.renamedFrom && pubNames.has(from)) x.renamedFrom = from;
    x.name = v;
    if (x.renamedFrom === v) delete x.renamedFrom;
    if (!tt.fields.some(y => y !== x && y.name === v)) renameRefs(tt, from, v);
  });
  const setType = v => upd(x => {
    ['length', 'precision', 'scale', 'values', 'ref', 'default'].forEach(k => delete x[k]);
    x.type = v;
    if (v === 'string') x.length = 255;
    if (v === 'enum') x.values = ['VALUE_1'];
    if (v === 'ref') { const tg = others[0]; const tf = tg && store.templates[tg].draft.fields.find(y => y.type !== 'id'); x.ref = { target: tg || '', display: tf?.name || 'id', onDelete: 'RESTRICT' }; }
    if (x.ui?.widget && !TYPES[v].widgets.includes(x.ui.widget)) setSub(x, 'ui', 'widget', undefined);
    delete x.constraints;
  });
  const defMode = f.default === undefined ? '' : typeof f.default === 'object' && f.default ? 'fn:' + f.default.fn : 'value';
  const fnOptions = { datetime: ['now'], date: ['today'], uuid: ['uuid'], string: ['currentUser'], text: ['currentUser'] }[f.type] || [];

  if (f.type === 'id') {
    return html`<div class="card"><div class="card-h"><span class="mono">${f.name}</span><span class="chip">system primary key</span></div>
      <div class="card-b">
        <p class="muted" style="margin-top:0">Surrogate key. SQLite <code>INTEGER PRIMARY KEY AUTOINCREMENT</code>,
          PostgreSQL <code>BIGINT GENERATED BY DEFAULT AS IDENTITY</code>. The system assigns it, so it is read-only for every role.</p>
        <div class="grid2">
          <${Text} label="Name" value=${f.name} mono lazy onChange=${setName} disabled=${isPub} hint=${isPub ? 'Immutable after publish' : ''} />
          <${Sel} label="Placement" value=${placementOf(f)} options=${['hidden', 'column', 'detail']} onChange=${v => upd(x => setSub(x, 'ui', 'placement', v === 'hidden' ? 'hidden' : v))} />
        </div>
      </div></div>`;
  }

  return html`<div class="card">
    <div class="card-h"><span class="mono">${f.name}</span>${f.renamedFrom && html`<span class="chip acc">renamed from ${f.renamedFrom}</span>`}
      <span class="spacer"></span><button class="btn sm danger" onClick=${onDelete}>Delete</button></div>
    <div class="card-b">
      <div class="section"><div class="section-t">Basics</div>
        <div class="grid2">
          <${Text} label="Name (column)" value=${f.name} mono lazy onChange=${setName} hint=${isPub ? 'Renaming keeps the data (RENAME COLUMN)' : 'snake_case'} />
          <${Text} label="Label" value=${f.label} onChange=${v => upd(x => setOrDel(x, 'label', v))} />
          <${Sel} label="Type" value=${f.type} options=${Object.keys(TYPES).filter(k => k !== 'id').map(k => [k, TYPES[k].label])}
            onChange=${setType} disabled=${isPub} hint=${isPub ? 'Immutable after publish (v1)' : ''} />
          ${f.type === 'string' && html`<${Num} label="Length" value=${f.length} onChange=${v => upd(x => setOrDel(x, 'length', v))} placeholder="255" />`}
          ${f.type === 'decimal' && html`<${Num} label="Precision" value=${f.precision} onChange=${v => upd(x => setOrDel(x, 'precision', v))} placeholder="18" />`}
          ${f.type === 'decimal' && html`<${Num} label="Scale" value=${f.scale} onChange=${v => upd(x => setOrDel(x, 'scale', v))} placeholder="2" />`}
        </div>
        <div style="margin-top:10px"><${Text} label="Description" value=${f.description} onChange=${v => upd(x => setOrDel(x, 'description', v))} /></div>
      </div>

      ${f.type === 'enum' && html`<div class="section"><div class="section-t">Enum values</div>
        <table class="tbl"><thead><tr><th>Value</th><th>Label</th><th>Color</th><th></th></tr></thead><tbody>
          ${enumValues(f).map((e, i) => html`<tr key=${i}>
            <td><input class="inp mono" value=${e.value} onInput=${ev => upd(x => { const vs = enumValues(x); vs[i].value = ev.target.value; x.values = vs; })} /></td>
            <td><input class="inp" value=${e.label || ''} onInput=${ev => upd(x => { const vs = enumValues(x); setOrDel(vs[i], 'label', ev.target.value); x.values = vs; })} /></td>
            <td><select class="inp" value=${e.color || ''} onChange=${ev => upd(x => { const vs = enumValues(x); setOrDel(vs[i], 'color', ev.target.value); x.values = vs; })}>
              <option value="">—</option>${COLORS.map(cl => html`<option value=${cl}>${cl}</option>`)}</select></td>
            <td><button class="btn ghost sm" title="Remove" onClick=${() => upd(x => { const vs = enumValues(x); vs.splice(i, 1); x.values = vs; })}>✕</button></td>
          </tr>`)}
        </tbody></table>
        <button class="btn sm" style="margin-top:6px" onClick=${() => upd(x => { x.values = [...enumValues(x), { value: `VALUE_${enumValues(x).length + 1}` }]; })}>+ Value</button>
      </div>`}

      ${f.type === 'ref' && html`<div class="section"><div class="section-t">Reference</div>
        <div class="grid2">
          <${Sel} label="Target table" value=${f.ref?.target} options=${[['', '— choose —'], ...others]} onChange=${v => upd(x => {
            const tf = store.templates[v]?.draft.fields.find(y => y.type !== 'id'); x.ref = { ...x.ref, target: v, display: tf?.name || 'id' };
          })} />
          <${Sel} label="Display field" value=${f.ref?.display} options=${(store.templates[f.ref?.target]?.draft.fields || []).map(y => y.name)}
            onChange=${v => upd(x => { x.ref = { ...x.ref, display: v }; })} />
          <${Sel} label="On delete of target row" value=${f.ref?.onDelete || 'RESTRICT'} options=${['RESTRICT', 'CASCADE', 'SET_NULL']}
            onChange=${v => upd(x => { x.ref = { ...x.ref, onDelete: v }; })} />
        </div>
        <p class="hint muted">The column stores the target's <code>id</code>. Grids and lookups show <code>${f.ref?.display}</code>.</p>
      </div>`}

      <div class="section"><div class="section-t">Constraints</div>
        <div style="display:flex;gap:18px;margin-bottom:10px;flex-wrap:wrap">
          <${Check} label="Required" checked=${f.required} onChange=${v => upd(x => setOrDel(x, 'required', v || undefined))} />
          ${f.type !== 'json' && f.type !== 'text' && html`<${Check} label="Unique" checked=${f.unique} onChange=${v => upd(x => setOrDel(x, 'unique', v || undefined))} />`}
          ${T.str && html`<${Check} label="Not blank" checked=${c.notBlank} onChange=${v => upd(x => setSub(x, 'constraints', 'notBlank', v || undefined))} />`}
        </div>
        <div class="grid2">
          <${Sel} label="Default" value=${defMode} options=${[['', 'none'], ['value', 'literal value'], ...fnOptions.map(fn => ['fn:' + fn, fn + '()'])]}
            onChange=${v => upd(x => { if (!v) delete x.default; else if (v === 'value') x.default = f.type === 'enum' ? enumValues(x)[0]?.value : f.type === 'boolean' ? false : T.num ? 0 : ''; else x.default = { fn: v.slice(3) }; })} />
          ${defMode === 'value' && (f.type === 'enum'
            ? html`<${Sel} label="Default value" value=${f.default} options=${enumValues(f).map(e => e.value)} onChange=${v => upd(x => { x.default = v; })} />`
            : f.type === 'boolean'
              ? html`<${Sel} label="Default value" value=${String(f.default)} options=${['true', 'false']} onChange=${v => upd(x => { x.default = v === 'true'; })} />`
              : T.num ? html`<${Num} label="Default value" value=${f.default} onChange=${v => upd(x => { x.default = v ?? 0; })} />`
              : html`<${Text} label="Default value" value=${f.default} onChange=${v => upd(x => { x.default = v; })} />`)}
          ${T.str && html`<${Num} label="Min length" value=${c.minLength} onChange=${v => upd(x => setSub(x, 'constraints', 'minLength', v))} />`}
          ${T.str && html`<${Num} label="Max length" value=${c.maxLength} onChange=${v => upd(x => setSub(x, 'constraints', 'maxLength', v))} />`}
          ${f.type === 'string' && html`<${Text} label="Pattern (regex)" mono value=${c.pattern} onChange=${v => upd(x => setSub(x, 'constraints', 'pattern', v))} hint="App-enforced, anchored" />`}
          ${f.type === 'string' && html`<${Sel} label="Format" value=${c.format} options=${[['', 'none'], 'email', 'url', 'hostname', 'ipv4']} onChange=${v => upd(x => setSub(x, 'constraints', 'format', v))} />`}
          ${T.num && html`<${Num} label="Min" value=${c.min} onChange=${v => upd(x => setSub(x, 'constraints', 'min', v))} />`}
          ${T.num && html`<${Num} label="Max" value=${c.max} onChange=${v => upd(x => setSub(x, 'constraints', 'max', v))} />`}
          ${T.temporal && html`<${Text} label="Min" mono value=${c.min} placeholder="ISO value" onChange=${v => upd(x => setSub(x, 'constraints', 'min', v))} />`}
          ${T.temporal && html`<${Text} label="Max" mono value=${c.max} placeholder="ISO value" onChange=${v => upd(x => setSub(x, 'constraints', 'max', v))} />`}
        </div>
        <div style="margin-top:10px"><${JsonBox} label="Required when (JsonLogic)" value=${f.requiredWhen} onChange=${v => upd(x => setOrDel(x, 'requiredWhen', v))}
          hint="Context: record fields, $op, $user. Custom op: present" /></div>
      </div>

      <div class="section"><div class="section-t">UI ${ds && html`<span class="chip warn">ignored for DATA_SOURCE</span>`}</div>
        <div class="grid2">
          <label class="fld"><span class="l">Placement in view grid</span>
            <div class="seg">${['column', 'detail', 'hidden'].map(p => html`<button type="button" class=${placementOf(f) === p ? 'on' : ''}
              onClick=${() => upd(x => setSub(x, 'ui', 'placement', p))}>${p}</button>`)}</div>
            <span class="hint">column = row label · detail = expanded row · hidden = NIL</span></label>
          <${Sel} label="Input widget" value=${f.ui?.widget || ''} options=${[['', `default (${T.widgets?.[0]})`], ...(T.widgets || [])]}
            onChange=${v => upd(x => setSub(x, 'ui', 'widget', v))} />
          <${Num} label="Column width (px)" value=${f.ui?.width} onChange=${v => upd(x => setSub(x, 'ui', 'width', v))} />
          <${Text} label="Form group" value=${f.ui?.group} onChange=${v => upd(x => setSub(x, 'ui', 'group', v))} />
          <${Text} label="Help text" value=${f.ui?.help} onChange=${v => upd(x => setSub(x, 'ui', 'help', v))} />
          <${Text} label="Placeholder" value=${f.ui?.placeholder} onChange=${v => upd(x => setSub(x, 'ui', 'placeholder', v))} />
          <${Text} label="Display format" mono value=${f.ui?.format} placeholder=${f.type === 'datetime' ? 'yyyy-MM-dd HH:mm' : T.num ? "0.00 's'" : ''}
            onChange=${v => upd(x => setSub(x, 'ui', 'format', v))} />
        </div>
        <div class="grid2" style="margin-top:10px">
          <${JsonBox} label="Visible when" value=${f.ui?.visibleWhen} onChange=${v => upd(x => setSub(x, 'ui', 'visibleWhen', v))} />
          <${JsonBox} label="Read-only when" value=${f.ui?.readonlyWhen} onChange=${v => upd(x => setSub(x, 'ui', 'readonlyWhen', v))} />
        </div>
      </div>

      <div class="section"><div class="section-t">Effective access</div>
        <div class="kv">${store.roles.map(r => html`<span class="mono">${r}</span>
          <span>${[...fieldOps(t, f, [r])].join(', ') || html`<span class="muted">none</span>`}${f.access?.[r] ? html` <span class="chip acc">field override</span>` : ''}</span>`)}</div>
        <p class="hint muted">Edit per-role field overrides in the Access tab.</p>
      </div>
    </div>
  </div>`;
}

/* ============================================================================
 * Rules tab
 * ========================================================================== */
const RULE_KINDS = {
  requires: 'If field X is present, fields Y… must be present',
  exclusive: 'At most one of the fields may be present',
  atLeastOne: 'At least one of the fields must be present',
  expr: 'Custom JsonLogic assertion',
};
function RulesTab({ t, updT, issues }) {
  const rules = t.rules || [];
  const upd = (i, fn) => updT(x => fn(x.rules[i], x));
  const add = () => updT(x => {
    x.rules = x.rules || [];
    let n = x.rules.length + 1; while (x.rules.some(r => r.id === `rule_${n}`)) n++;
    x.rules.push({ id: `rule_${n}`, kind: 'requires', if: '', then: [], message: '' });
  });
  const setKind = (i, k) => upd(i, r => {
    for (const key of ['if', 'then', 'fields', 'assert']) delete r[key];
    r.kind = k;
    if (k === 'requires') { r.if = ''; r.then = []; }
    if (k === 'exclusive' || k === 'atLeastOne') r.fields = [];
    if (k === 'expr') { r.assert = true; r.fields = []; }
  });
  return html`<div style="max-width:980px">
    <div class="toolbar"><span class="muted">Rules run on every write, in the browser and on the server. <b>requires</b>, <b>exclusive</b> and <b>atLeastOne</b> without a <code>when</code> also become SQL CHECK constraints, so direct inserts can't break them.</span>
      <span class="spacer"></span><button class="btn" onClick=${add}>+ Add rule</button></div>
    ${!rules.length && html`<div class="card empty">No cross-field rules yet.</div>`}
    ${rules.map((r, i) => {
      const sql = ruleCheckSql(t, r);
      const iss = issues.filter(s => s.path === `rules[${i}]`);
      return html`<div class="card rule-card" key=${i}>
        <div class="card-h"><span class="mono">${r.id}</span><span class=${'chip ' + (sql ? 'ok' : 'acc')}>${sql ? 'DB CHECK + app' : 'app only'}</span>
          ${iss.map(s => html`<span class=${'chip ' + (s.level === 'error' ? 'err' : 'warn')}>${s.code}</span>`)}
          <span class="spacer"></span><button class="btn sm danger" onClick=${() => updT(x => x.rules.splice(i, 1))}>Delete</button></div>
        <div class="card-b">
          <div class="grid2">
            <${Text} label="Rule id" mono value=${r.id} onChange=${v => upd(i, x => { x.id = v; })} />
            <${Sel} label="Kind" value=${r.kind} options=${Object.keys(RULE_KINDS).map(k => [k, `${k}: ${RULE_KINDS[k]}`])} onChange=${v => setKind(i, v)} />
          </div>
          <div style="margin-top:10px">
          ${r.kind === 'requires' && html`<div class="grid2">
              <${Sel} label="If this field is present…" value=${r.if} options=${[['', '— choose —'], ...t.fields.filter(f => f.type !== 'id').map(f => f.name)]} onChange=${v => upd(i, x => { x.if = v; })} />
              <label class="fld"><span class="l">…then these must be present</span><${FieldPicker} fields=${t.fields.filter(f => f.name !== r.if)} value=${r.then} onChange=${v => upd(i, x => { x.then = v; })} /></label>
            </div>`}
          ${(r.kind === 'exclusive' || r.kind === 'atLeastOne') && html`<label class="fld"><span class="l">Fields</span>
              <${FieldPicker} fields=${t.fields} value=${r.fields} onChange=${v => upd(i, x => { x.fields = v; })} /></label>`}
          ${r.kind === 'expr' && html`<div class="grid2">
              <${JsonBox} label="Assert (must be truthy)" rows=${4} value=${r.assert} onChange=${v => upd(i, x => { x.assert = v ?? true; })} />
              <label class="fld"><span class="l">Highlight fields on failure</span><${FieldPicker} fields=${t.fields} value=${r.fields} onChange=${v => upd(i, x => setOrDel(x, 'fields', v))} /></label>
            </div>`}
          </div>
          <div class="grid2" style="margin-top:10px">
            <${JsonBox} label="Only when (optional guard)" value=${r.when} onChange=${v => upd(i, x => setOrDel(x, 'when', v))} hint="A guarded rule is enforced by the app only" />
            <${Text} label="Error message" value=${r.message} onChange=${v => upd(i, x => setOrDel(x, 'message', v))} />
          </div>
          ${sql && html`<div style="margin-top:10px"><div class="section-t">Generated check</div><pre class="code">CHECK (${sql})</pre></div>`}
        </div></div>`;
    })}
  </div>`;
}

/* ============================================================================
 * Actions tab
 * ========================================================================== */
function ActionsTab({ t, store, updT, mutate }) {
  const actions = t.actions || [];
  const [sel, setSel] = useState(0);
  const a = actions[sel];
  const upd = fn => updT(x => fn(x.actions[sel], x));
  const add = () => {
    let n = 1; while (actions.some(x => x.name === `action_${n}`)) n++;
    const name = `action_${n}`, script = `${t.name}/${name}.js`;
    mutate(s => {
      const d = s.templates[t.name].draft;
      d.actions = d.actions || [];
      d.actions.push({ name, label: `Action ${n}`, placement: 'row', script, function: 'run', timeoutMs: 3000 });
      if (s.scripts[script] == null) s.scripts[script] = `/**\n * Action: ${t.name}.${name}\n * @param {ActionContext} ctx\n * @returns {ActionResult}\n */\nfunction run(ctx) {\n  return { kind: "message", content: "Hello from ${name} for row " + (ctx.record ? ctx.record.id : "-") };\n}\n`;
    });
    setSel(actions.length);
  };
  const src = a ? store.scripts[a.script] : null;
  const fnFound = a && src != null && new RegExp(`function\\s+${(a.function || '').replace(/[$]/g, '\\$')}\\s*\\(`).test(src);
  return html`<div class="split" style="grid-template-columns:260px 1fr">
    <div class="card"><div class="card-h">Actions<span class="spacer"></span><button class="btn sm" onClick=${add}>+ Add</button></div>
      <table class="tbl"><tbody>${actions.map((x, i) => html`<tr key=${i} class=${'click' + (i === sel ? ' sel' : '')} onClick=${() => setSel(i)}>
        <td><div style="font-weight:600">${x.label}</div><div class="mono muted" style="font-size:12px">${x.name} · ${x.placement}</div></td></tr>`)}</tbody></table>
      ${!actions.length && html`<div class="empty">No actions</div>`}</div>
    ${a ? html`<div class="card"><div class="card-h"><span class="mono">${a.name}</span><span class="spacer"></span>
        <button class="btn sm danger" onClick=${() => { updT(x => x.actions.splice(sel, 1)); setSel(0); }}>Delete</button></div>
      <div class="card-b">
        <div class="grid2">
          <${Text} label="Name" mono value=${a.name} onChange=${v => upd(x => { x.name = v; })} hint=${`Permission: run:${a.name}`} />
          <${Text} label="Button label" value=${a.label} onChange=${v => upd(x => { x.label = v; })} />
          <${Sel} label="Placement" value=${a.placement} options=${[['row', 'row: button on each row'], ['toolbar', 'toolbar: one button above the grid'], ['selection', 'selection: runs on selected rows']]} onChange=${v => upd(x => { x.placement = v; })} />
          <${Num} label="Timeout (ms)" value=${a.timeoutMs} onChange=${v => upd(x => setOrDel(x, 'timeoutMs', v))} placeholder="3000" />
          <${Sel} label="Script file (scripts/…)" value=${a.script} options=${Object.keys(store.scripts)} onChange=${v => upd(x => { x.script = v; })} />
          <${Text} label="Function" mono value=${a.function} onChange=${v => upd(x => { x.function = v; })}
            hint=${fnFound ? '✓ found in script' : '✗ not found in script'} />
          <${Text} label="Confirmation prompt (optional)" value=${a.confirm} onChange=${v => upd(x => setOrDel(x, 'confirm', v))} />
          <${Text} label="Icon" value=${a.icon} onChange=${v => upd(x => setOrDel(x, 'icon', v))} />
        </div>
        <div style="margin-top:10px"><${JsonBox} label="Visible when (per row)" value=${a.visibleWhen} onChange=${v => upd(x => setOrDel(x, 'visibleWhen', v))} /></div>
        <div class="section" style="margin-top:14px"><div class="section-t">scripts/${a.script}
          <span class=${'chip ' + (fnFound ? 'ok' : 'err')}>${fnFound ? `${a.function}() found` : `${a.function}() missing`}</span></div>
          <textarea class="inp code" rows="18" spellcheck="false" value=${src ?? ''} onInput=${e => mutate(s => { s.scripts[a.script] = e.target.value; })} />
          <p class="hint muted">The service loads every file under <code>scripts/</code> at startup and hot-reloads it on change. It runs in a GraalJS sandbox with no host access, IO or threads; <code>ctx</code> is the only bridge. Saving here writes the file.</p>
        </div>
      </div></div>` : html`<div class="card empty">Add an action to attach a JavaScript function to a button.</div>`}
  </div>`;
}

/* ============================================================================
 * Access tab
 * ========================================================================== */
const FIELD_PRESETS = [['inherit', 'inherit'], ['none', 'none'], ['read', 'read'], ['read,create', 'read + create'], ['read,update', 'read + update'], ['read,create,update', 'read + create + update']];
function AccessTab({ t, store, updT }) {
  const acc = accessOf(t);
  const cols = [...TABLE_OPS, 'run:*', ...(t.actions || []).map(a => 'run:' + a.name)];
  const toggle = (role, op) => updT(x => {
    x.access = clone(accessOf(x));
    const ops = new Set(x.access[role] || []);
    ops.has(op) ? ops.delete(op) : ops.add(op);
    x.access[role] = [...ops];
  });
  const setField = (fi, role, v) => updT(x => {
    const f = x.fields[fi];
    if (v === 'inherit') { if (f.access) { delete f.access[role]; if (!Object.keys(f.access).length) delete f.access; } return; }
    f.access = f.access || {};
    f.access[role] = v === 'none' ? [] : v.split(',');
  });
  const roles = store.roles.filter(r => r !== 'admin');
  return html`<div style="max-width:1100px">
    ${!t.access && html`<div class="banner info">No <code>access</code> block, so defaults apply: admin gets everything; viewer gets read${t.manageType === 'DATA_SOURCE' ? ' on nothing (DATA_SOURCE)' : ''}. Toggling any box writes an explicit block.</div>`}
    <div class="card section"><div class="card-h">Table permissions</div>
      <div style="overflow:auto"><table class="tbl matrix"><thead><tr><th>Role</th>${cols.map(c => html`<th class="mono">${c}</th>`)}</tr></thead>
        <tbody>${store.roles.map(r => html`<tr key=${r}><td><span class="mono" style="font-weight:600">${r}</span>
            ${r === 'admin' && html` <span class="chip">built-in, all</span>`}${r === 'viewer' && html` <span class="chip">default for every user</span>`}</td>
          ${cols.map(c => html`<td><input type="checkbox" aria-label=${`${r} ${c}`} disabled=${r === 'admin'}
            checked=${r === 'admin' || (acc[r] || []).includes(c)} onChange=${() => toggle(r, c)} /></td>`)}</tr>`)}
        </tbody></table></div></div>
    <div class="card"><div class="card-h">Field overrides <span class="muted" style="font-weight:400">: can only narrow table permissions; admin is never narrowed</span></div>
      <div style="overflow:auto"><table class="tbl"><thead><tr><th>Field</th>${roles.map(r => html`<th class="mono">${r}</th>`)}</tr></thead>
        <tbody>${t.fields.map((f, fi) => f.type === 'id' ? null : html`<tr key=${fi}><td class="mono">${f.name}</td>
          ${roles.map(r => {
            const explicit = f.access?.[r];
            const val = explicit === undefined ? 'inherit' : explicit.length ? FIELD_OPS.filter(o => explicit.includes(o)).join(',') : 'none';
            const eff = [...fieldOps(t, f, [r])].join(', ') || 'none';
            return html`<td><select class="inp" style="min-width:150px" value=${val} onChange=${e => setField(fi, r, e.target.value)}>
              ${FIELD_PRESETS.map(([v, l]) => html`<option value=${v}>${l}</option>`)}</select>
              <div class="hint muted" style="font-size:11px">effective: ${eff}</div></td>`;
          })}</tr>`)}</tbody></table></div></div>
  </div>`;
}

/* ============================================================================
 * View tab
 * ========================================================================== */
function ViewTab({ t, updT }) {
  const v = t.view || {};
  const setV = (k, val) => updT(x => { x.view = x.view || {}; setOrDel(x.view, k, val); if (!Object.keys(x.view).length) delete x.view; });
  const cols = ordered(t.fields).filter(f => placementOf(f) === 'column');
  const det = ordered(t.fields).filter(f => placementOf(f) === 'detail');
  const sorts = v.defaultSort || [];
  const fieldOpts = [...t.fields.map(f => f.name), ...AUDIT];
  if (t.manageType === 'DATA_SOURCE') return html`<div class="banner">DATA_SOURCE templates get no generated UI. Only <b>titleField</b> matters: it is what lookups in other tables display.
    <div style="max-width:320px;margin-top:10px"><${Sel} label="Title field" value=${v.titleField} options=${[['', '—'], ...t.fields.map(f => f.name)]} onChange=${x => setV('titleField', x)} /></div></div>`;
  return html`<div class="split">
    <div class="card"><div class="card-h">Grid settings</div><div class="card-b">
      <div class="grid2">
        <${Sel} label="Title field" value=${v.titleField} options=${[['', '—'], ...t.fields.map(f => f.name)]} onChange=${x => setV('titleField', x)} />
        <${Sel} label="Page size" value=${String(v.pageSize || 25)} options=${['10', '25', '50', '100']} onChange=${x => setV('pageSize', Number(x))} />
      </div>
      <div class="section" style="margin-top:12px"><div class="section-t">Default sort</div>
        ${sorts.map((s, i) => html`<div key=${i} style="display:flex;gap:8px;margin-bottom:6px">
          <select class="inp" value=${s.field} onChange=${e => updT(x => { x.view.defaultSort[i].field = e.target.value; })}>${fieldOpts.map(n => html`<option value=${n}>${n}</option>`)}</select>
          <select class="inp" style="width:110px" value=${s.dir || 'asc'} onChange=${e => updT(x => { x.view.defaultSort[i].dir = e.target.value; })}><option value="asc">asc</option><option value="desc">desc</option></select>
          <button class="btn ghost sm" onClick=${() => updT(x => { x.view.defaultSort.splice(i, 1); if (!x.view.defaultSort.length) delete x.view.defaultSort; })}>✕</button></div>`)}
        <button class="btn sm" onClick=${() => updT(x => { x.view = x.view || {}; x.view.defaultSort = [...(x.view.defaultSort || []), { field: x.fields[0].name, dir: 'asc' }]; })}>+ Sort key</button>
      </div>
      <div class="section"><div class="section-t">Free-text search fields</div>
        <${FieldPicker} fields=${t.fields} value=${v.search} filter=${f => TYPES[f.type]?.str} onChange=${x => setV('search', x)} /></div>
      <div class="section"><div class="section-t">Filter fields</div>
        <${FieldPicker} fields=${t.fields} value=${v.filters} filter=${f => f.type !== 'json'} onChange=${x => setV('filters', x)} /></div>
    </div></div>
    <div class="card"><div class="card-h">Layout from field placement</div><div class="card-b">
      <div class="section-t">Columns (row labels)</div>
      <div class="pickers" style="margin-bottom:12px">${cols.map(f => html`<span class="chip acc">${f.label || f.name}</span>`)}</div>
      <div class="section-t">Expanded row (details)</div>
      <div class="pickers">${det.map(f => html`<span class="chip">${f.ui?.group ? f.ui.group + ' · ' : ''}${f.label || f.name}</span>`)}${!det.length && html`<span class="muted">none</span>`}</div>
      <p class="hint muted">Reorder in the Fields tab. Set placement per field.</p>
    </div></div>
  </div>`;
}

/* ============================================================================
 * Preview tab — the UI the service will generate
 * ========================================================================== */
function Widget({ f, value, onChange, disabled, store, invalid }) {
  const cls = 'inp' + (invalid ? ' invalid' : '');
  const ph = f.ui?.placeholder || '';
  switch (widgetOf(f)) {
    case 'textarea': return html`<textarea class=${cls} rows="3" disabled=${disabled} placeholder=${ph} value=${value ?? ''} onInput=${e => onChange(e.target.value === '' ? null : e.target.value)} />`;
    case 'number': return html`<input class=${cls} type="number" step=${TYPES[f.type].int ? '1' : 'any'} disabled=${disabled} value=${value ?? ''}
      onInput=${e => onChange(e.target.value === '' ? null : Number(e.target.value))} />`;
    case 'switch': case 'checkbox': return html`<label class="chk"><input type="checkbox" disabled=${disabled} checked=${!!value} onChange=${e => onChange(e.target.checked)} />${value ? 'Yes' : 'No'}</label>`;
    case 'date': return html`<input class=${cls} type="date" disabled=${disabled} value=${value ?? ''} onInput=${e => onChange(e.target.value || null)} />`;
    case 'datetime': return html`<input class=${cls} type="datetime-local" disabled=${disabled} value=${value ? String(value).slice(0, 16) : ''} onInput=${e => onChange(e.target.value ? e.target.value + ':00Z' : null)} />`;
    case 'time': return html`<input class=${cls} type="time" step="1" disabled=${disabled} value=${value ?? ''} onInput=${e => onChange(e.target.value || null)} />`;
    case 'select': return html`<select class=${cls} disabled=${disabled} value=${value ?? ''} onChange=${e => onChange(e.target.value || null)}>
      <option value="">— select —</option>${enumValues(f).map(e => html`<option value=${e.value}>${e.label || e.value}</option>`)}</select>`;
    case 'radio': return html`<div class="pickers">${enumValues(f).map(e => html`<label class="chk"><input type="radio" name=${f.name} disabled=${disabled} checked=${value === e.value} onChange=${() => onChange(e.value)} />${e.label || e.value}</label>`)}</div>`;
    case 'lookup': return html`<select class=${cls} disabled=${disabled} value=${value ?? ''} onChange=${e => onChange(e.target.value ? Number(e.target.value) : null)}>
      <option value="">— select —</option>${(store.samples[f.ref?.target] || []).map(r => html`<option value=${r.id}>${r[f.ref.display]}</option>`)}</select>`;
    case 'json': return html`<textarea class=${cls + ' code'} rows="3" disabled=${disabled} value=${value == null ? '' : typeof value === 'string' ? value : JSON.stringify(value)}
      onInput=${e => { const s = e.target.value; try { onChange(s ? JSON.parse(s) : null); } catch { onChange(s); } }} />`;
    default: return html`<input class=${cls} disabled=${disabled} placeholder=${ph} value=${value ?? ''} onInput=${e => onChange(e.target.value === '' ? null : e.target.value)} />`;
  }
}

function RecordForm({ t, store, roles, user, rec, op, rows, onSave, onClose }) {
  const [vals, setVals] = useState(() => {
    if (op === 'update') return { ...rec };
    const o = {};
    for (const f of t.fields) {
      if (f.default === undefined || f.type === 'id') continue;
      if (typeof f.default === 'object' && f.default) o[f.name] = f.default.fn === 'now' ? new Date().toISOString().replace(/\.\d+Z$/, 'Z') : f.default.fn === 'today' ? new Date().toISOString().slice(0, 10) : f.default.fn === 'currentUser' ? user.username : null;
      else o[f.name] = f.default;
    }
    return o;
  });
  const [tried, setTried] = useState(false);
  const res = validateRecord(t, vals, op, user, rows);
  const data = { ...vals, $op: op, $user: user };
  const fields = ordered(t.fields).filter(f => f.type !== 'id' && fieldOps(t, f, roles).size);
  const groups = [];
  for (const f of fields) {
    let vis = true;
    if (f.ui?.visibleWhen) { try { vis = truthy(jl(f.ui.visibleWhen, data)); } catch { /* ignore */ } }
    if (!vis) continue;
    const g = f.ui?.group || '';
    let grp = groups.find(x => x.name === g);
    if (!grp) groups.push(grp = { name: g, fields: [] });
    grp.fields.push(f);
  }
  const save = () => { setTried(true); if (res.ok) onSave(vals); };
  return html`<div class="drawer-bg" onClick=${e => e.target === e.currentTarget && onClose()}>
    <div class="drawer" role="dialog" aria-label="Edit record">
      <div class="modal-h">${op === 'create' ? `New ${t.label || t.name} row` : `Edit ${textOf(t.fields.find(f => f.name === t.view?.titleField) || t.fields[0], vals[t.view?.titleField], store) || '#' + vals.id}`}
        <span class="spacer"></span><button class="btn ghost" onClick=${onClose}>✕</button></div>
      <div class="modal-b" style="flex:1">
        ${groups.map(g => html`<div class="section">${g.name && html`<div class="section-t">${g.name}</div>`}
          ${g.fields.map(f => {
            const ops = fieldOps(t, f, roles);
            let ro = !ops.has(op);
            if (!ro && f.ui?.readonlyWhen) { try { ro = truthy(jl(f.ui.readonlyWhen, data)); } catch { /* ignore */ } }
            let req = !!f.required;
            if (!req && f.requiredWhen) { try { req = truthy(jl(f.requiredWhen, data)); } catch { /* ignore */ } }
            const err = tried && res.errs[f.name];
            return html`<label class="fld" style="margin-bottom:10px" key=${f.name}>
              <span class="l">${f.label || f.name}${req && html`<span style="color:var(--danger)"> *</span>`}${ro && html` <span class="chip">read-only</span>`}</span>
              <${Widget} f=${f} value=${vals[f.name]} disabled=${ro} store=${store} invalid=${!!err} onChange=${v => setVals(o => ({ ...o, [f.name]: v }))} />
              ${err ? html`<span class="err-t">${err}</span>` : f.ui?.help && html`<span class="hint">${f.ui.help}</span>`}</label>`;
          })}</div>`)}
        ${tried && res.general.map(m => html`<div class="banner err">${m}</div>`)}
      </div>
      <div class="modal-f"><button class="btn" onClick=${onClose}>Cancel</button><button class="btn primary" onClick=${save}>${op === 'create' ? 'Create' : 'Save'}</button></div>
    </div></div>`;
}

function Preview({ t, store, mutate, roleSel, setRoleSel, setModal, toast }) {
  const roles = [...new Set([roleSel, 'viewer'])];
  const user = { username: `demo_${roleSel}`, roles };
  const rows = withSamples(t, store.samples[t.name] || [], store);
  const v = t.view || {};
  const [qText, setQ] = useState('');
  const [flt, setFlt] = useState({});
  const [sort, setSort] = useState(() => (v.defaultSort || [])[0] || null);
  const [page, setPage] = useState(0);
  const [open, setOpen] = useState({});
  const [picked, setPicked] = useState([]);
  const [edit, setEdit] = useState(null);
  const fmap = Object.fromEntries(t.fields.map(f => [f.name, f]));
  const reverse = Object.entries(store.templates).flatMap(([n, e]) => e.draft.fields.filter(f => f.type === 'ref' && f.ref?.target === t.name).map(f => `${n}.${f.name}`));
  const api = html`<div class="card section"><div class="card-h">REST API (generated)</div><div class="card-b mono">
    ${[['GET', `/api/data/${t.name}?page=0&size=${v.pageSize || 25}&sort=${sort ? sort.field + ',' + (sort.dir || 'asc') : 'id,asc'}&q=…&filter[field]=…`, 'read'],
       ['GET', `/api/data/${t.name}/{id}`, 'read'], ['POST', `/api/data/${t.name}`, 'create'], ['PUT', `/api/data/${t.name}/{id}`, 'update'],
       ['PATCH', `/api/data/${t.name}/{id}`, 'update'], ['DELETE', `/api/data/${t.name}/{id}`, 'delete'],
       ...(t.actions || []).map(a => ['POST', `/api/data/${t.name}/${a.placement === 'row' ? '{id}/' : ''}actions/${a.name}`, 'run:' + a.name])]
      .map(([m, p, op]) => html`<div class="endpoint"><b>${m}</b><span style="flex:1">${p}</span><span class=${'chip ' + (can(t, roles, op) ? 'ok' : '')}>${op}</span></div>`)}
  </div></div>`;
  const rolePick = html`<label class="chk">Preview as role
    <select class="inp" style="width:auto" value=${roleSel} onChange=${e => setRoleSel(e.target.value)}>${store.roles.map(r => html`<option value=${r}>${r}</option>`)}</select></label>
    <span class="muted">(+ viewer, which every user has)</span>`;

  if (t.manageType === 'DATA_SOURCE') {
    return html`<div>
      <div class="banner">This is a <b>DATA_SOURCE</b>, so no end-user UI is generated. Rows are loaded directly into the table or through REST.
        ${reverse.length ? html` Referenced by: ${reverse.map(r => html`<span class="chip acc mono" style="margin-left:4px">${r}</span>`)}` : ' Nothing references it yet.'}</div>
      ${api}
      <div class="card"><div class="card-h">Current rows <span class="muted" style="font-weight:400">: admin data browser, not generated for end users</span></div>
        <div style="overflow:auto"><table class="tbl"><thead><tr>${t.fields.map(f => html`<th>${f.label || f.name}</th>`)}</tr></thead>
          <tbody>${rows.map(r => html`<tr>${t.fields.map(f => html`<td><${Cell} f=${f} v=${r[f.name]} store=${store} /></td>`)}</tr>`)}</tbody></table></div></div>
    </div>`;
  }

  if (!can(t, roles, 'read')) return html`<div><div class="toolbar">${rolePick}</div><div class="banner warn">Role <b>${roleSel}</b> cannot read <b>${t.name}</b>, so this table won't appear in their navigation.</div>${api}</div>`;

  const columns = ordered(t.fields).filter(f => placementOf(f) === 'column' && fieldOps(t, f, roles).has('read'));
  const details = ordered(t.fields).filter(f => placementOf(f) === 'detail' && fieldOps(t, f, roles).has('read'));
  const rowActions = (t.actions || []).filter(a => a.placement === 'row' && can(t, roles, 'run:' + a.name));
  const barActions = (t.actions || []).filter(a => a.placement !== 'row' && can(t, roles, 'run:' + a.name));
  const selActions = barActions.filter(a => a.placement === 'selection');
  const manage = t.manageType === 'MANAGE_VIEW';
  const canC = manage && can(t, roles, 'create'), canU = manage && can(t, roles, 'update'), canD = manage && can(t, roles, 'delete');

  const searchFields = (v.search?.length ? v.search : columns.filter(f => TYPES[f.type]?.str).map(f => f.name)).filter(n => fmap[n]);
  let list = rows.filter(r => !qText || searchFields.some(n => String(r[n] ?? '').toLowerCase().includes(qText.toLowerCase())));
  for (const [n, val] of Object.entries(flt)) {
    if (!present(val) || !fmap[n]) continue;
    const f = fmap[n];
    list = list.filter(r => f.type === 'enum' || f.type === 'ref' || f.type === 'boolean' ? String(r[n]) === String(val)
      : TYPES[f.type]?.temporal ? String(r[n] ?? '') >= val : String(r[n] ?? '').toLowerCase().includes(String(val).toLowerCase()));
  }
  if (sort && (fmap[sort.field] || AUDIT.includes(sort.field))) {
    const f = fmap[sort.field] || { type: 'string' };
    const key = r => f.type === 'ref' || f.type === 'enum' ? textOf(f, r[sort.field], store) : r[sort.field];
    list = [...list].sort((a, b) => {
      const x = key(a), y = key(b);
      const c = x == null ? 1 : y == null ? -1 : typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y));
      return sort.dir === 'desc' ? -c : c;
    });
  }
  const size = v.pageSize || 25, pages = Math.max(1, Math.ceil(list.length / size)), pg = Math.min(page, pages - 1);
  const pageRows = list.slice(pg * size, pg * size + size);

  const exec = (a, record, records) => {
    if (a.confirm && !confirm(a.confirm)) return;
    try {
      const out = runAction(a, t, store, record, records, user);
      const r = out.result || {};
      if (r.kind === 'text') setModal({ kind: 'result', action: a, out });
      else if (r.kind === 'download' && out.files[0]) download(out.files[0].name, out.files[0].text, 'text/plain');
      else toast(r.content || `${a.label} done (${out.ms} ms)`);
    } catch (e) { toast(`Action ${a.name} failed: ${e.message}`); }
  };
  const saveRow = (vals, op) => mutate(s => {
    const arr = s.samples[t.name] = withSamples(t, s.samples[t.name] || [], s);
    if (op === 'create') arr.push({ ...vals, id: Math.max(0, ...arr.map(r => r.id)) + 1 });
    else { const i = arr.findIndex(r => r.id === vals.id); arr[i] = vals; }
  });
  const colCount = columns.length + (details.length ? 1 : 0) + (selActions.length ? 1 : 0) + 2;

  return html`<div>
    <div class="toolbar">${rolePick}<span class="spacer"></span>
      ${t.manageType === 'VIEW' && html`<span class="chip">VIEW: read-only grid; rows arrive via REST or direct insert</span>`}</div>
    <div class="card section">
      <div class="card-h" style="flex-wrap:wrap">${t.label || t.name}<span class="chip">${list.length} rows</span><span class="spacer"></span>
        <input class="inp" style="width:220px" placeholder=${`Search ${searchFields.join(', ')}`} value=${qText} onInput=${e => { setQ(e.target.value); setPage(0); }} />
        ${barActions.map(a => html`<button class="btn" disabled=${a.placement === 'selection' && !picked.length}
          onClick=${() => exec(a, null, a.placement === 'selection' ? rows.filter(r => picked.includes(r.id)) : list)}>${a.label}</button>`)}
        ${canC && html`<button class="btn primary" onClick=${() => setEdit({ op: 'create', rec: {} })}>+ New</button>`}
      </div>
      ${(v.filters || []).length > 0 && html`<div class="toolbar" style="padding:8px 14px 0">${v.filters.filter(n => fmap[n]).map(n => {
        const f = fmap[n], val = flt[n] ?? '';
        const set = x => { setFlt(o => ({ ...o, [n]: x })); setPage(0); };
        const lbl = f.label || n;
        if (f.type === 'enum') return html`<select class="inp" style="width:auto" value=${val} onChange=${e => set(e.target.value)}><option value="">${lbl}: all</option>${enumValues(f).map(e => html`<option value=${e.value}>${e.label || e.value}</option>`)}</select>`;
        if (f.type === 'ref') return html`<select class="inp" style="width:auto" value=${val} onChange=${e => set(e.target.value)}><option value="">${lbl}: all</option>${(store.samples[f.ref.target] || []).map(r => html`<option value=${r.id}>${r[f.ref.display]}</option>`)}</select>`;
        if (f.type === 'boolean') return html`<select class="inp" style="width:auto" value=${val} onChange=${e => set(e.target.value)}><option value="">${lbl}: all</option><option value="true">Yes</option><option value="false">No</option></select>`;
        if (TYPES[f.type]?.temporal) return html`<label class="chk muted">${lbl} from <input class="inp" style="width:auto" type="date" value=${val} onInput=${e => set(e.target.value)} /></label>`;
        return html`<input class="inp" style="width:160px" placeholder=${lbl + ' contains'} value=${val} onInput=${e => set(e.target.value)} />`;
      })}${Object.values(flt).some(present) && html`<button class="btn ghost sm" onClick=${() => setFlt({})}>Clear filters</button>`}</div>`}
      <div style="overflow:auto;margin-top:8px"><table class="tbl">
        <thead><tr>
          ${details.length > 0 && html`<th style="width:30px"></th>`}
          ${selActions.length > 0 && html`<th style="width:30px"><input type="checkbox" aria-label="Select page" checked=${pageRows.length && pageRows.every(r => picked.includes(r.id))}
            onChange=${e => setPicked(e.target.checked ? [...new Set([...picked, ...pageRows.map(r => r.id)])] : picked.filter(id => !pageRows.some(r => r.id === id)))} /></th>`}
          ${columns.map(f => html`<th class="sortable" style=${f.ui?.width ? `width:${f.ui.width}px` : ''}
            onClick=${() => setSort(s => s?.field === f.name ? { field: f.name, dir: s.dir === 'desc' ? 'asc' : 'desc' } : { field: f.name, dir: 'asc' })}>
            ${f.label || f.name}${sort?.field === f.name ? (sort.dir === 'desc' ? ' ▼' : ' ▲') : ''}</th>`)}
          <th style="width:24px"></th><th></th></tr></thead>
        <tbody>${pageRows.map(r => {
          const chk = validateRecord(t, r, 'update', user);
          const isOpen = open[r.id];
          const data = { ...r, $op: 'update', $user: user };
          const acts = rowActions.filter(a => { if (!a.visibleWhen) return true; try { return truthy(jl(a.visibleWhen, data)); } catch { return false; } });
          const groups = {};
          details.forEach(f => (groups[f.ui?.group || ''] = groups[f.ui?.group || ''] || []).push(f));
          return html`
            <tr key=${r.id} class=${details.length ? 'click' : ''} onClick=${() => details.length && setOpen(o => ({ ...o, [r.id]: !o[r.id] }))}>
              ${details.length > 0 && html`<td class="muted">${isOpen ? '▾' : '▸'}</td>`}
              ${selActions.length > 0 && html`<td onClick=${e => e.stopPropagation()}><input type="checkbox" aria-label="Select row" checked=${picked.includes(r.id)}
                onChange=${e => setPicked(p => e.target.checked ? [...p, r.id] : p.filter(x => x !== r.id))} /></td>`}
              ${columns.map(f => html`<td class=${TYPES[f.type]?.num ? 'num' : ''}><${Cell} f=${f} v=${r[f.name]} store=${store} /></td>`)}
              <td>${!chk.ok && html`<span class="flag" title=${['Row breaks app-level rules (inserted directly?):', ...Object.entries(chk.errs).map(([k, m]) => `${k}: ${m}`), ...chk.general].join('\n')}>⚠</span>`}</td>
              <td style="white-space:nowrap;text-align:right" onClick=${e => e.stopPropagation()}>
                ${acts.map(a => html`<button class="btn sm" style="margin-left:4px" onClick=${() => exec(a, r)}>${a.label}</button>`)}
                ${canU && html`<button class="btn sm" style="margin-left:4px" onClick=${() => setEdit({ op: 'update', rec: r })}>Edit</button>`}
                ${canD && html`<button class="btn sm danger" style="margin-left:4px" onClick=${() => confirm('Delete this row?') && mutate(s => { s.samples[t.name] = (s.samples[t.name] || []).filter(x => x.id !== r.id); })}>Delete</button>`}
              </td></tr>
            ${isOpen && html`<tr key=${r.id + '-d'}><td colspan=${colCount} style="background:var(--panel-2)">
              <dl class="detail">${Object.entries(groups).map(([g, fs]) => html`
                ${g && html`<div class="dgroup">${g}</div>`}
                ${fs.map(f => html`<div><dt>${f.label || f.name}</dt><dd><${Cell} f=${f} v=${r[f.name]} store=${store} /></dd></div>`)}`)}
              </dl></td></tr>`}`;
        })}
        ${!pageRows.length && html`<tr><td colspan=${colCount} class="empty">No rows match</td></tr>`}</tbody></table></div>
      <div class="pager" style="padding:8px 14px">Page ${pg + 1} / ${pages}
        <button class="btn sm" disabled=${pg === 0} onClick=${() => setPage(pg - 1)}>‹</button><button class="btn sm" disabled=${pg >= pages - 1} onClick=${() => setPage(pg + 1)}>›</button></div>
    </div>
    ${api}
    ${edit && html`<${RecordForm} t=${t} store=${store} roles=${roles} user=${user} rec=${edit.rec} op=${edit.op} rows=${rows}
      onClose=${() => setEdit(null)} onSave=${vals => { saveRow(vals, edit.op); setEdit(null); toast(edit.op === 'create' ? 'Row created' : 'Row saved'); }} />`}
  </div>`;
}

/* ============================================================================
 * DDL, JSON tabs
 * ========================================================================== */
const CLS_CHIP = { safe: 'ok', metadata: '', checked: 'warn', destructive: 'err', blocked: 'err' };
function PlanList({ steps }) {
  if (!steps.length) return html`<div class="muted">No changes since the published version.</div>`;
  return html`<div>${steps.map(s => html`<div class="step"><span class="cls"><span class=${'chip ' + CLS_CHIP[s.cls]}>${s.cls}</span></span><span>${s.text}</span></div>`)}
    ${needsRebuild(steps) && html`<p class="hint muted">SQLite can't ALTER constraints, so these changes rebuild the table in one transaction (create new → copy → drop → rename).</p>`}</div>`;
}
function DdlTab({ t, entry, toast }) {
  const steps = planMigration(entry.published, t);
  const sl = genDDL(t, 'sqlite'), pg = genDDL(t, 'pg');
  return html`<div>
    <div class="card section"><div class="card-h">Migration plan <span class="muted" style="font-weight:400">: draft vs ${entry.published ? 'published v' + entry.version : 'nothing (new table)'}</span></div>
      <div class="card-b"><${PlanList} steps=${steps} /></div></div>
    <div class="split" style="grid-template-columns:1fr 1fr">
      ${[['SQLite (local dev)', sl], ['PostgreSQL', pg]].map(([title, sql]) => html`<div class="card"><div class="card-h">${title}<span class="spacer"></span>
        <button class="btn sm" onClick=${() => copy(sql).then(() => toast('DDL copied'))}>Copy</button></div>
        <div class="card-b"><pre class="code">${sql}</pre></div></div>`)}
    </div></div>`;
}
function JsonTab({ t, store, mutate, sel, toast }) {
  const [text, setText] = useState(() => exportJson(t));
  const [err, setErr] = useState(null);
  const dirty = text !== exportJson(t);
  useEffect(() => { setText(exportJson(t)); setErr(null); }, [stable(t)]);
  const apply = () => {
    try {
      const obj = JSON.parse(text); delete obj.$schema;
      if (obj.name !== sel) throw new Error(`"name" must stay "${sel}". Use Import to create a different template`);
      if (!Array.isArray(obj.fields)) throw new Error('"fields" must be an array');
      mutate(s => { s.templates[sel].draft = obj; });
      setErr(null); toast('Draft updated from JSON');
    } catch (e) { setErr(e.message); }
  };
  return html`<div>
    <div class="toolbar"><span class="muted">The template document. Validated against <code>schema/tds-template.schema.json</code> (JSON Schema 2020-12) and then by the semantic checks.</span><span class="spacer"></span>
      <button class="btn" disabled=${!dirty} onClick=${() => { setText(exportJson(t)); setErr(null); }}>Revert</button>
      <button class="btn primary" disabled=${!dirty} onClick=${apply}>Apply to draft</button></div>
    ${err && html`<div class="banner err">${err}</div>`}
    <textarea class="inp code" spellcheck="false" style="min-height:62vh" value=${text} onInput=${e => setText(e.target.value)} />
  </div>`;
}

/* ============================================================================
 * Modals
 * ========================================================================== */
function PublishModal({ entry, t, issues, onPublish, onClose }) {
  const steps = planMigration(entry.published, t);
  const errors = issues.filter(i => i.level === 'error');
  const blocked = steps.some(s => s.cls === 'blocked');
  const destructive = steps.some(s => s.cls === 'destructive');
  const [typed, setTyped] = useState('');
  const ok = !errors.length && !blocked && steps.length > 0 && (!destructive || typed === t.name);
  return html`<${Modal} title=${`Publish ${t.name} as v${(entry.version || 0) + 1}`} onClose=${onClose} wide
    footer=${html`<button class="btn" onClick=${onClose}>Cancel</button><button class="btn primary" disabled=${!ok} onClick=${() => onPublish(steps)}>Apply & publish</button>`}>
    ${errors.length > 0 && html`<div class="banner err"><b>${errors.length} validation error(s)</b> must be fixed first:<ul style="margin:6px 0 0">${errors.map(e => html`<li><code>${e.code}</code> ${e.msg}</li>`)}</ul></div>`}
    ${blocked && html`<div class="banner err">The plan has a blocked step.</div>`}
    <div class="section-t">Migration plan</div>
    <${PlanList} steps=${steps} />
    ${destructive && html`<div class="banner warn" style="margin-top:12px">This plan loses data. Type <b class="mono">${t.name}</b> to confirm.
      <input class="inp mono" style="margin-top:6px" value=${typed} onInput=${e => setTyped(e.target.value)} /></div>`}
    <p class="hint muted">The service runs the plan in one transaction, pre-checks existing rows for <b>checked</b> steps, stores the JSON and DDL as a new version in <code>tds_template_version</code>, and then regenerates the REST and UI metadata. No restart needed.</p>
  <//>`;
}
function NewTemplateModal({ store, onCreate, onClose }) {
  const [name, setName] = useState('');
  const [label, setLabel] = useState('');
  const [mt, setMt] = useState('MANAGE_VIEW');
  const err = !name ? null : !NAME_RE.test(name) || name.startsWith('tds_') ? 'snake_case, must not start with tds_' : store.templates[name] ? 'already exists' : null;
  return html`<${Modal} title="New template" onClose=${onClose}
    footer=${html`<button class="btn" onClick=${onClose}>Cancel</button><button class="btn primary" disabled=${!name || err} onClick=${() => onCreate(name, label, mt)}>Create draft</button>`}>
    <div class="grid2">
      <${Text} label="Table name" mono value=${name} onChange=${setName} placeholder="e.g. jackpot_limits" hint=${err ? html`<span class="err-t">${err}</span>` : 'Immutable after first publish'} />
      <${Text} label="Label" value=${label} onChange=${setLabel} placeholder="Jackpot Limits" />
    </div>
    <div class="section-t" style="margin-top:14px">Manage type</div>
    ${Object.entries(MANAGE_TYPES).map(([k, d]) => html`<label class="chk" style="display:flex;margin-bottom:6px"><input type="radio" name="mt" checked=${mt === k} onChange=${() => setMt(k)} />
      <span class=${'mt ' + k}>${k}</span><span class="muted">${d}</span></label>`)}
  <//>`;
}
function RolesModal({ store, mutate, onClose }) {
  const [n, setN] = useState('');
  const err = n && (!ROLE_RE.test(n) ? 'lower_snake_case' : store.roles.includes(n) ? 'exists' : null);
  const usage = r => Object.entries(store.templates).filter(([, e]) => e.draft.access?.[r] || e.draft.fields.some(f => f.access?.[r])).map(([k]) => k);
  return html`<${Modal} title="Roles" onClose=${onClose} footer=${html`<button class="btn" onClick=${onClose}>Close</button>`}>
    <p class="muted" style="margin-top:0">Roles are managed separately from templates; templates only reference them by name. Admins assign roles to users in the admin console (next phase). Every user implicitly has <b>viewer</b>.</p>
    <table class="tbl"><thead><tr><th>Role</th><th>Used by</th><th></th></tr></thead><tbody>
      ${store.roles.map(r => html`<tr><td class="mono">${r}${BUILTIN_ROLES.includes(r) && html` <span class="chip">built-in</span>`}</td>
        <td>${usage(r).map(u => html`<span class="chip" style="margin-right:4px">${u}</span>`)}</td>
        <td>${!BUILTIN_ROLES.includes(r) && html`<button class="btn sm danger" disabled=${usage(r).length > 0} title=${usage(r).length ? 'Remove from templates first' : ''}
          onClick=${() => mutate(s => { s.roles = s.roles.filter(x => x !== r); })}>Remove</button>`}</td></tr>`)}

      <div style="flex:1"><${Text} label="New role" mono value=${n} onChange=${setN} placeholder="e.g. operator_lead" hint=${err && html`<span class="err-t">${err}</span>`} /></div>
      <button class="btn primary" style="margin-top:20px" disabled=${!n || err} onClick=${() => { mutate(s => { s.roles.push(n); }); setN(''); }}>Add</button></div>
  <//>`;
}
function ResultModal({ action, out, onClose }) {
  const r = out.result, file = out.files[0];
  return html`<${Modal} title=${r.title || action.label} onClose=${onClose} wide
    footer=${html`${file && html`<button class="btn" onClick=${() => download(file.name, file.text, 'text/plain')}>Download ${file.name}</button>`}
      <button class="btn primary" onClick=${() => copy(r.content)}>Copy</button>`}>
    <div class="muted" style="margin-bottom:8px">Ran <code>${action.script}#${action.function}</code> in ${out.ms} ms${file ? html`; server would write <code>data/action-output/…/${file.name}</code>` : ''}.</div>
    <pre class="code" style="white-space:pre-wrap">${r.content}</pre>

/* ============================================================================
 * App shell
 * ========================================================================== */
function statusOf(e) {
  if (!e.published) return { cls: 'draft', text: 'Draft, never published' };
  return same(e.published, e.draft) ? { cls: 'pub', text: `Published v${e.version}` } : { cls: 'chg', text: `v${e.version} + unpublished changes` };
}
function App() {
  const [store, setStore] = useState(loadStore);
  const names = Object.keys(store.templates).sort();
  const [sel, setSel] = useState(names.includes('alerts') ? 'alerts' : names[0]);
  const [tab, setTab] = useState('fields');
  const [fieldIdx, setFieldIdx] = useState(1);
  const [modal, setModal] = useState(null);
  const [toastMsg, setToastMsg] = useState(null);
  const [roleSel, setRoleSel] = useState('viewer');
  const [showIssues, setShowIssues] = useState(true);
  const mutate = fn => setStore(s => { const n = clone(s); fn(n); saveStore(n); return n; });
  const toast = m => { setToastMsg(m); clearTimeout(window.__tt); window.__tt = setTimeout(() => setToastMsg(null), 2600); };
  const entry = store.templates[sel];
  const t = entry?.draft;
  const updT = fn => mutate(s => fn(s.templates[sel].draft, s));
  const issues = useMemo(() => t ? validateTemplate(t, store) : [], [store, sel]);
  const allIssues = useMemo(() => Object.fromEntries(names.map(n => [n, validateTemplate(store.templates[n].draft, store)])), [store]);
  const errCount = issues.filter(i => i.level === 'error').length, warnCount = issues.length - errCount;
  const select = n => { setSel(n); setFieldIdx(1); };

  const publish = steps => {
    mutate(s => {
      const e = s.templates[sel];
      const d = e.draft;
      const pubNames = new Set((e.published?.fields || []).map(f => f.name));
      s.samples[sel] = (s.samples[sel] || []).map(r => {
        const o = { ...r };
        for (const f of d.fields) if (f.renamedFrom && f.renamedFrom in o) { o[f.name] = o[f.renamedFrom]; delete o[f.renamedFrom]; }
        for (const k of Object.keys(o)) if (k !== 'id' && !d.fields.some(f => f.name === k) && pubNames.has(k)) delete o[k];
        return o;
      });
      d.fields.forEach(f => delete f.renamedFrom);
      e.published = clone(d);
      e.version = (e.version || 0) + 1;
      e.history = [{ version: e.version, at: new Date().toISOString(), by: 'you', note: `${steps.length} change(s)` }, ...(e.history || [])];
    });
    setModal(null); toast(`${sel} published`);
  };
  const create = (name, label, mt) => {
    mutate(s => {
      s.templates[name] = { draft: { grammar: 'tds/v1', name, label: label || name, manageType: mt,
        fields: [{ name: 'id', type: 'id', ui: { placement: 'hidden' } }],
        access: { admin: ['read', 'create', 'update', 'delete', 'run:*'], viewer: mt === 'DATA_SOURCE' ? [] : ['read'] },
        view: { pageSize: 25 } }, published: null, version: 0, history: [] };
      s.samples[name] = [];
    });
    setModal(null); setSel(name); setTab('fields'); setFieldIdx(0);
  };
  const importFile = e => {
    const file = e.target.files[0]; if (!file) return;
    file.text().then(txt => {
      try {
        const obj = JSON.parse(txt); delete obj.$schema;
        if (!obj.name || !Array.isArray(obj.fields)) throw new Error('not a tds/v1 template');
        mutate(s => {
          if (s.templates[obj.name]) s.templates[obj.name].draft = obj;
          else { s.templates[obj.name] = { draft: obj, published: null, version: 0, history: [] }; s.samples[obj.name] = []; }
        });
        setSel(obj.name); toast(`Imported ${obj.name} as draft`);
      } catch (err) { toast('Import failed: ' + err.message); }
    });
    e.target.value = '';
  };
  const gotoIssue = i => {
    const m = /^(fields|rules|actions|indexes)\[(\d+)\]/.exec(i.path || '');
    if (m?.[1] === 'fields') { setTab('fields'); setFieldIdx(Number(m[2])); }
    else if (m?.[1] === 'rules') setTab('rules');
    else if (m?.[1] === 'actions') setTab('actions');
    else if (m?.[1] === 'indexes') setTab('json');
    else if (i.path === 'access') setTab('access');
    else if (i.path === 'view') setTab('view');
    else setTab('json');
  };

  const st = entry && statusOf(entry);
  const TABS = [['fields', 'Fields', t?.fields.length], ['rules', 'Rules', t?.rules?.length], ['actions', 'Actions', t?.actions?.length], ['access', 'Access'],
    ['view', 'View'], ['preview', 'Preview'], ['ddl', 'DDL & Plan'], ['json', 'JSON']];

  return html`<div class="app">
    <header class="topbar">
      <div class="brand">TDS <span>· Schema Studio</span></div>
      <nav class="topnav"><button class="on">Templates</button><button onClick=${() => setModal({ kind: 'roles' })}>Roles</button>
        <button disabled title="Next phase">Users</button></nav>
      <span class="spacer"></span>
      <span class="chip">prototype · data stays in this browser</span>
      <button class="btn sm" onClick=${() => { if (confirm('Reset all templates, scripts and sample rows to the repository seeds?')) { const s = initStore(); saveStore(s); setStore(s); setSel('alerts'); } }}>Reset demo</button>
    </header>
    <div class="body">
      <aside class="sidebar">
        <div class="side-head"><button class="btn primary" style="flex:1" onClick=${() => setModal({ kind: 'new' })}>+ New template</button>
          <label class="btn" title="Import a template JSON file">Import<input type="file" accept=".json,application/json" style="display:none" onChange=${importFile} /></label></div>
        <div class="tlist">${names.map(n => {
          const e = store.templates[n], s = statusOf(e), errs = allIssues[n].filter(i => i.level === 'error').length;
          return html`<button class=${'titem' + (n === sel ? ' on' : '')} onClick=${() => select(n)}>
            <div class="row1"><span class=${'dot ' + s.cls}></span>${e.draft.label || n}<span class="spacer"></span><span class=${'mt ' + e.draft.manageType}>${e.draft.manageType.replace('_', ' ')}</span></div>
            <div class="row2"><span class="mono">${n}</span>·<span>${s.text}</span>${errs > 0 && html`<span class="chip err">${errs}</span>`}</div></button>`;
        })}</div>
      </aside>
      ${t ? html`<main class="main">
        <div class="thead">
          <div class="thead-row">
            <h1>${t.label || t.name}</h1><span class="mono muted">${t.name}</span>
            <span class=${'chip ' + (st.cls === 'pub' ? 'ok' : st.cls === 'chg' ? 'warn' : '')}>${st.text}</span>
            <span class="spacer"></span>
            <button class=${'chip ' + (errCount ? 'err' : warnCount ? 'warn' : 'ok')} style="cursor:pointer" onClick=${() => setShowIssues(x => !x)}>
              ${errCount ? `${errCount} error${errCount > 1 ? 's' : ''}` : 'valid'}${warnCount ? ` · ${warnCount} warning${warnCount > 1 ? 's' : ''}` : ''}</button>
            ${!entry.published && html`<button class="btn danger" onClick=${() => { if (confirm(`Delete draft ${sel}?`)) { mutate(s => { delete s.templates[sel]; delete s.samples[sel]; }); setSel(names.find(n => n !== sel)); } }}>Delete draft</button>`}
            <button class="btn" onClick=${() => download(`${t.name}.json`, exportJson(t))}>Export JSON</button>
            <button class="btn primary" onClick=${() => setModal({ kind: 'publish' })} disabled=${st.cls === 'pub'}>Publish…</button>
          </div>
          <div class="thead-row sub" style="margin-top:8px">
            <span class="muted">Manage type</span>
            <div class="seg">${Object.keys(MANAGE_TYPES).map(k => html`<button class=${t.manageType === k ? 'on' : ''} title=${MANAGE_TYPES[k]} onClick=${() => updT(x => { x.manageType = k; })}>${k}</button>`)}</div>
            <span class="muted">${MANAGE_TYPES[t.manageType]}</span>
          </div>
          <div class="grid2" style="max-width:820px;margin-bottom:6px">
            <${Text} label="Label" value=${t.label} onChange=${v => updT(x => setOrDel(x, 'label', v))} />
            <${Text} label="Description" value=${t.description} onChange=${v => updT(x => setOrDel(x, 'description', v))} />
          </div>
          <nav class="tabs">${TABS.map(([k, l, c]) => html`<button class=${tab === k ? 'on' : ''} onClick=${() => setTab(k)}>${l}${c != null && html`<span class="cnt">${c}</span>`}</button>`)}</nav>
        </div>
        <section class="content">
          ${tab === 'fields' && html`<${FieldsTab} t=${t} entry=${entry} store=${store} updT=${updT} idx=${Math.min(fieldIdx, t.fields.length - 1)} setIdx=${setFieldIdx} issues=${issues} />`}
          ${tab === 'rules' && html`<${RulesTab} t=${t} updT=${updT} issues=${issues} />`}
          ${tab === 'actions' && html`<${ActionsTab} key=${sel} t=${t} store=${store} updT=${updT} mutate=${mutate} />`}
          ${tab === 'access' && html`<${AccessTab} t=${t} store=${store} updT=${updT} />`}
          ${tab === 'view' && html`<${ViewTab} t=${t} updT=${updT} />`}
          ${tab === 'preview' && html`<${Preview} key=${sel} t=${t} store=${store} mutate=${mutate} roleSel=${roleSel} setRoleSel=${setRoleSel} setModal=${setModal} toast=${toast} />`}
          ${tab === 'ddl' && html`<${DdlTab} t=${t} entry=${entry} toast=${toast} />`}
          ${tab === 'json' && html`<${JsonTab} key=${sel} t=${t} store=${store} mutate=${mutate} sel=${sel} toast=${toast} />`}
        </section>
        ${issues.length > 0 && html`<div class="issues">
          <div class="issues-h" onClick=${() => setShowIssues(x => !x)}>${showIssues ? '▾' : '▸'} Validation
            ${errCount > 0 && html`<span class="chip err">${errCount} error${errCount > 1 ? 's' : ''}</span>`}${warnCount > 0 && html`<span class="chip warn">${warnCount} warning${warnCount > 1 ? 's' : ''}</span>`}</div>
          ${showIssues && issues.map(i => html`<div class=${'issue ' + i.level} onClick=${() => gotoIssue(i)}><span class="code">${i.code}</span><span>${i.msg}</span></div>`)}
        </div>`}
      </main>` : html`<main class="main"><div class="empty">No template selected</div></main>`}
    </div>
    ${modal?.kind === 'publish' && html`<${PublishModal} entry=${entry} t=${t} issues=${issues} onPublish=${publish} onClose=${() => setModal(null)} />`}
    ${modal?.kind === 'new' && html`<${NewTemplateModal} store=${store} onCreate=${create} onClose=${() => setModal(null)} />`}
    ${modal?.kind === 'roles' && html`<${RolesModal} store=${store} mutate=${mutate} onClose=${() => setModal(null)} />`}
    ${modal?.kind === 'result' && html`<${ResultModal} action=${modal.action} out=${modal.out} onClose=${() => setModal(null)} />`}
    ${toastMsg && html`<div class="toast" role="status">${toastMsg}</div>`}
  </div>`;
}

render(html`<${App} />`, document.getElementById('app'));
</script>
</body>
</html>
